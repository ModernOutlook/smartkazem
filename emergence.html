<!doctype html>
<html lang="fa" dir="rtl">
<head>
<script src="audio-engine.js"></script>
<link rel="stylesheet" href="ui/shared/layout-spec.css">
<link rel="stylesheet" href="ui/mobile/mobile.css">
<script src="ui/bootstrap.js" defer></script>
<script src="translations/i18n.js" defer></script>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>فصل اول ظهور — Modern Outlook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--gold:#d7ae55;--gold2:#f0d58b;--text:#f6f0df;--muted:#a9a293;--line:rgba(240,213,139,.18)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050609;color:var(--text);font-family:Vazirmatn,system-ui,sans-serif}body{overflow-x:hidden}
.page{min-height:100svh;background:radial-gradient(circle at 36% 8%,rgba(255,229,153,.18),transparent 28%),radial-gradient(ellipse at 78% 70%,rgba(255,203,86,.18),transparent 32%),linear-gradient(180deg,#21160d 0%,#68431b 31%,#9d6726 58%,#d09a45 78%,#3a2410 100%)}
.page:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 10%,#ffe7a0 0 1px,transparent 2px),radial-gradient(circle at 27% 23%,#fff0bd 0 1px,transparent 2px),radial-gradient(circle at 63% 10%,#ffe9a6 0 1px,transparent 2px),radial-gradient(circle at 86% 23%,#fff3c7 0 1px,transparent 2px);background-size:123px 137px,157px 149px,181px 163px,139px 151px;opacity:.45}
.shell{width:min(1180px,calc(100% - 28px));margin:auto;padding:24px 0 42px;position:relative;z-index:1}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;padding:18px 0 22px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:.7rem;letter-spacing:.22em;color:var(--gold2);text-transform:uppercase}.title h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(2rem,5vw,4rem);font-weight:500;margin:6px 0}.title p{margin:0;color:#e5d8bd;font-size:.9rem}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--text);padding:9px 13px;border-radius:12px;cursor:pointer;text-decoration:none}
.controls,.reader,.side{border:1px solid var(--line);background:rgba(12,9,5,.28);backdrop-filter:blur(9px);box-shadow:0 20px 60px rgba(0,0,0,.18)}.controls{padding:16px;margin-top:18px;border-radius:18px}.controls h3{margin:0 0 12px;font-size:.9rem;color:var(--gold2)}
.episode-list{display:grid;grid-template-columns:repeat(10,minmax(44px,1fr));gap:8px}.episode{aspect-ratio:1;border:1px solid var(--line);background:rgba(0,0,0,.24);color:var(--muted);padding:0;border-radius:10px;cursor:pointer;font:500 .78rem/1 Vazirmatn,system-ui,sans-serif;display:grid;place-items:center}.episode:hover,.episode.active{background:rgba(215,174,85,.13);border-color:rgba(240,213,139,.46);color:var(--gold2)}
.visual{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:18px;margin-top:18px;align-items:stretch}.visual>.art-card{align-self:stretch}.side{padding:14px;border-radius:20px}.art-card{border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));border-radius:22px;padding:14px;box-shadow:0 24px 80px rgba(0,0,0,.28)}
.art-frame{aspect-ratio:3/4;overflow:hidden;border-radius:15px;background:rgba(9,7,4,.62);border:1px solid var(--line);position:relative;display:grid;place-items:center;text-align:center;color:var(--muted);line-height:2;padding:28px}.art-frame img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:2}.art-frame:before{content:"";position:absolute;inset:12%;border:1px solid rgba(240,213,139,.12);border-radius:50%;box-shadow:0 0 0 28px rgba(215,174,85,.04),0 0 0 56px rgba(215,174,85,.025)}.art-frame span{position:relative;z-index:1}.art-head,.reader-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.story-label,.block h3{color:var(--gold2);font-size:.72rem}.art-index{font-size:.7rem;color:var(--gold2)}.art-caption{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:.72rem;color:var(--muted)}
.reader{border-radius:20px;padding:clamp(20px,4vw,38px);min-height:620px}.reader-head{border-bottom:1px solid var(--line);padding-bottom:18px}.reader-head h2{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.6rem,4vw,2.7rem);font-weight:500;margin:5px 0}.reader-head p{margin:0;color:var(--muted);font-size:.82rem}.block{margin-top:24px}.prose{line-height:2.25;color:#eee3cf;white-space:pre-line}.placeholder{padding:28px;border:1px dashed var(--line);border-radius:16px;color:var(--muted);line-height:2;text-align:center}.navrow{display:flex;gap:10px;margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}.navrow button{flex:1}
@media(max-width:820px){.visual{grid-template-columns:1fr}.art-card{max-width:520px;margin:auto;width:100%}.episode-list{grid-template-columns:repeat(8,minmax(44px,1fr))}}@media(max-width:520px){.shell{width:min(100% - 18px,1180px);padding-top:12px}.top{display:block}.actions{margin-top:14px}.episode-list{grid-template-columns:repeat(5,minmax(44px,1fr));gap:7px}.reader{padding:18px}.reader-head{display:block}}
.global-lang{display:flex;gap:4px;align-items:center}.global-lang button{border:1px solid var(--line);background:rgba(0,0,0,.22);color:var(--muted);padding:6px 8px;border-radius:8px;cursor:pointer;font:500 .68rem/1 Vazirmatn,system-ui,sans-serif}.global-lang button.active{color:var(--gold2);border-color:rgba(240,213,139,.46);background:rgba(215,174,85,.13)}

.skip-link{position:fixed;top:8px;right:8px;z-index:1000;transform:translateY(-180%);padding:10px 14px;border-radius:10px;background:#fff;color:#000;text-decoration:none;font-weight:700;box-shadow:0 4px 18px rgba(0,0,0,.35)}.skip-link:focus{transform:translateY(0);outline:3px solid #fff;outline-offset:3px}:focus-visible{outline:3px solid #f0d58b;outline-offset:3px}.episode[aria-current="true"]{box-shadow:0 0 0 2px rgba(240,213,139,.65)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>

<main class="page" id="main-content"><div class="shell">
<header class="top"><div class="title"><div class="eyebrow">Modern Outlook</div><h1>فصل اول ظهور</h1><p>روایتی دربارهٔ ترس، حقیقت و انتخاب؛ فصل نخست در ۱۹ قسمت.</p></div><div class="actions"><div class="global-lang" id="global-lang" aria-label="زبان سایت" data-i18n-aria="labels.language"><button data-site-lang="zh" type="button">中文</button><button data-site-lang="fa" type="button">فارسی</button><button data-site-lang="en" type="button">English</button><button data-site-lang="ar" type="button">العربية</button></div><button class="btn" id="emergence-close" type="button" data-i18n="labels.back">بازگشت</button></div></header>
<section class="controls" aria-labelledby="episode-list-heading"><h3 id="episode-list-heading">قسمت‌های فصل اول</h3><nav aria-label="انتخاب قسمت" data-i18n-aria="labels.episodeNavigation"><div class="episode-list" id="episode-list"></div></nav></section>
<section class="visual"><div class="art-card"><div class="art-head"><span class="story-label">فصل اول ظهور</span><span class="art-index" id="art-index">۰۱ / ۱۹</span></div><div class="art-frame" id="art-frame"><img src="content/emergence1.jpg" alt="تصویر فصل اول ظهور"></div><div class="art-caption"><span id="art-caption">فصل اول ظهور</span></div><div class="navrow" aria-label="پیمایش قسمت‌ها" data-i18n-aria="labels.episodeNavigation"><button class="btn" id="prev" aria-label="رفتن به قسمت پیشین">پیشین</button><button class="btn" id="next" aria-label="رفتن به قسمت پسین">پسین</button></div></div><article class="reader" id="reader" tabindex="-1" aria-live="polite" aria-atomic="false"></article></section>
</div></main><script src="content/emergence.js"></script></body></html>
