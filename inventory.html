<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="i18n-page" content="inventory">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; child-src 'none'; connect-src 'self'; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' https://fonts.googleapis.com; style-src-attr 'none'; script-src 'self'; script-src-attr 'none'; form-action 'self'; upgrade-insecure-requests">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()">
  <title>فهرست کارت‌ها — SmartKazem</title>
  <link rel="stylesheet" href="ui/shared/layout-spec.css">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/pages/inventory.css">
  <link rel="stylesheet" href="ui/mobile/mobile.css">
  <link rel="stylesheet" href="css/desktop.css">
<script src="ui/bootstrap.js" defer></script>
</head>
<body>
  <main class="inventory-page">
    <div class="lang-switch" aria-label="زبان رابط" data-i18n-aria="labels.interfaceLanguage">
      <button id="ui-zh" data-site-lang="zh" type="button">中文</button>
      <button id="ui-fa" data-site-lang="fa" type="button">فارسی</button>
      <button id="ui-en" data-site-lang="en" type="button">English</button>
      <button id="ui-ar" data-site-lang="ar" type="button">العربية</button>
    </div>

    <header class="inventory-header">
      <div class="inventory-heading">
        <p class="inventory-eyebrow">SMARTKAZEM · INVENTORY</p>
        <h1 data-i18n="labels.cardInventory">فهرست کارت‌ها</h1>
        <p data-i18n="labels.inventoryDescription">۵۵ تصویر، با هویت مستقل و ترتیب ثابت.</p>
      </div>
      <a class="inventory-home" href="index.html" aria-label="بازگشت به صفحه اصلی" data-i18n="labels.homePage" data-i18n-aria="labels.homePage">بازگشت</a>
    </header>

    <section class="inventory-grid" id="inventory-grid" aria-label="کارت‌ها" data-i18n-aria="labels.cards"></section>
  </main>

  <script src="translations/i18n.js"></script>
  <script src="content/playing-cards.js"></script>
  <script src="js/inventory-page.js"></script>
</body>
</html>
