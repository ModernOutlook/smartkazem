<style>
:root{color-scheme:dark;--accent:#b653ff;--accent2:#d9a7ff;--text:#f8f1ff;--muted:#b9a8c8;--line:rgba(217,167,255,.2)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#05030a;color:var(--text);font-family:Vazirmatn,system-ui,sans-serif}body{overflow-x:hidden}
.page{min-height:100svh;background:radial-gradient(circle at 24% 12%,rgba(190,102,255,.22),transparent 28%),radial-gradient(ellipse at 82% 70%,rgba(72,205,255,.14),transparent 32%),linear-gradient(180deg,#090012 0%,#24103e 38%,#4e2580 68%,#151021 100%)}
.page:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 9% 11%,#fff 0 1px,transparent 2px),radial-gradient(circle at 28% 23%,#ead4ff 0 1px,transparent 2px),radial-gradient(circle at 68% 10%,#fff 0 1px,transparent 2px),radial-gradient(circle at 91% 31%,#e8caff 0 1px,transparent 2px);background-size:131px 149px,157px 137px,173px 151px,143px 163px;opacity:.46}
.page:after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 0 21%,rgba(242,213,255,.08) 21.4% 22%,transparent 22.4% 34%,rgba(129,218,255,.07) 34.4% 35%,transparent 35.4%),linear-gradient(90deg,transparent 49.8%,rgba(255,255,255,.08) 50%,transparent 50.2%)}
.shell{width:min(1180px,calc(100% - 28px));margin:auto;padding:24px 0 42px;position:relative;z-index:1}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;padding:18px 0 22px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:.7rem;letter-spacing:.22em;color:var(--accent2);text-transform:uppercase}.title h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(2rem,5vw,4rem);font-weight:500;margin:6px 0}.title p{margin:0;color:#e5d8f0;font-size:.9rem}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:rgba(10,2,18,.42);color:var(--text);padding:9px 13px;border-radius:12px;cursor:pointer;text-decoration:none}
.controls,.reader,.side{border:1px solid var(--line);background:rgba(10,2,18,.38);backdrop-filter:blur(9px);box-shadow:0 20px 60px rgba(0,0,0,.22)}.controls{padding:16px;margin-top:18px;border-radius:18px}.controls h3{margin:0 0 12px;font-size:.9rem;color:var(--accent2)}
.episode-list{display:grid;grid-template-columns:repeat(10,minmax(44px,1fr));gap:8px}.episode{aspect-ratio:1;border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--muted);padding:0;border-radius:10px;cursor:pointer;font:500 .78rem/1 Vazirmatn,system-ui,sans-serif;display:grid;place-items:center}.episode:hover,.episode.active{background:rgba(128,74,190,.25);border-color:rgba(246,221,255,.56);color:var(--accent2)}
.visual{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:18px;margin-top:18px;align-items:stretch}.visual>.art-card{align-self:stretch}.side{padding:14px;border-radius:20px}.art-card{border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));border-radius:22px;padding:14px;box-shadow:0 24px 80px rgba(0,0,0,.28)}
.art-frame{aspect-ratio:3/4;overflow:hidden;border-radius:15px;background:rgba(9,2,18,.68);border:1px solid var(--line);position:relative;display:grid;place-items:center;text-align:center;color:var(--muted);line-height:2;padding:28px}.art-frame:before{content:"";position:absolute;inset:12%;border:1px solid rgba(240,213,255,.12);border-radius:50%;box-shadow:0 0 0 28px rgba(181,111,255,.04),0 0 0 56px rgba(119,216,255,.025)}.art-frame img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:2}.art-frame span{position:relative;z-index:1}.art-head,.reader-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.story-label,.block h3{color:var(--accent2);font-size:.72rem}.art-index{font-size:.7rem;color:var(--accent2)}.art-caption{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:.72rem;color:var(--muted)}
.reader{border-radius:20px;padding:clamp(20px,4vw,38px);min-height:620px}.reader-head{border-bottom:1px solid var(--line);padding-bottom:18px}.reader-head h2{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.6rem,4vw,2.7rem);font-weight:500;margin:5px 0}.reader-head p{margin:0;color:var(--muted);font-size:.82rem}.block{margin-top:24px}.prose{line-height:2.25;color:#eee3f5;white-space:pre-line}.placeholder{padding:28px;border:1px dashed var(--line);border-radius:16px;color:var(--muted);line-height:2;text-align:center}.navrow{display:flex;gap:10px;margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}.navrow button{flex:1}
@media(max-width:820px){.visual{grid-template-columns:1fr}.art-card{max-width:520px;margin:auto;width:100%}.episode-list{grid-template-columns:repeat(8,minmax(44px,1fr))}}@media(max-width:520px){.shell{width:min(100% - 18px,1180px);padding-top:12px}.top{display:block}.actions{margin-top:14px}.episode-list{grid-template-columns:repeat(5,minmax(44px,1fr));gap:7px}.reader{padding:18px}.reader-head{display:block}}
.global-lang{display:flex;gap:4px;align-items:center}.global-lang button{border:1px solid var(--line);background:rgba(0,0,0,.22);color:var(--muted);padding:6px 8px;border-radius:8px;cursor:pointer;font:500 .68rem/1 Vazirmatn,system-ui,sans-serif}.global-lang button.active{color:var(--accent2);border-color:rgba(246,221,255,.46);background:rgba(128,74,190,.2)}
.skip-link{position:fixed;top:8px;right:8px;z-index:1000;transform:translateY(-180%);padding:10px 14px;border-radius:10px;background:#fff;color:#000;text-decoration:none;font-weight:700;box-shadow:0 4px 18px rgba(0,0,0,.35)}.skip-link:focus{transform:translateY(0);outline:3px solid #fff;outline-offset:3px}:focus-visible{outline:3px solid #d9a7ff;outline-offset:3px}.episode[aria-current="true"]{box-shadow:0 0 0 2px rgba(246,221,255,.65)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
