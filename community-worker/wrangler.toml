name = "smartkazem-community-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "smartkazem-community"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "smartkazem-community-media"

[vars]
SITE_ORIGIN = "https://modernoutlook.github.io"
TURNSTILE_ENABLED = "true"
