<!doctype html>
<html lang="fa" dir="rtl">
<head>
<script src="audio-engine.js"></script>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="i18n-page" content="possibleMirror">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; child-src 'none'; connect-src 'self'; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<title>آینه‌ی ممکن‌ها</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="ui/shared/layout-spec.css">
<link rel="stylesheet" href="ui/mobile/mobile.css">
<script src="ui/bootstrap.js" defer></script>
</head>
<body data-mode="fa">
<section class="possible-mirror-page" aria-labelledby="possible-mirror-title">
  <div class="possible-mirror-scene" aria-hidden="true">
    <div class="possible-mirror-river"></div>
    <div class="possible-mirror-ring r1"></div><div class="possible-mirror-ring r2"></div>
    <div class="possible-mirror-ring r3"></div><div class="possible-mirror-ring r4"></div>
    <div class="possible-mirror-island i1"></div><div class="possible-mirror-island i2"></div><div class="possible-mirror-island i3"></div>
    <div class="possible-mirror-reflection"></div>
  </div>
  <div class="lang-switch" id="possible-mirror-lang" aria-label="زبان سایت">
    <button data-site-lang="zh" type="button">中文</button>
    <button data-site-lang="fa" type="button">فارسی</button>
    <button data-site-lang="en" type="button">English</button>
    <button data-site-lang="ar" type="button">العربية</button>
  </div>
  <header class="possible-mirror-head">
    <div class="possible-mirror-title">
      <strong id="possible-mirror-title">آینه‌ی ممکن‌ها</strong>
      <span id="possible-mirror-subtitle">رمانی در باب اراده، احتمال و بازتاب</span>
    </div>
    <button class="possible-mirror-close" id="possible-mirror-close" type="button" data-i18n-aria="pages.possibleMirror.close" aria-label="بازگشت">✕</button>
  </header>
  <div class="possible-mirror-shell">
    <nav class="possible-mirror-tabs" id="possible-mirror-tabs" aria-label="فهرست بخش‌ها"></nav>
    <article class="possible-mirror-body" id="possible-mirror-body" tabindex="-1" aria-live="polite" aria-atomic="false"></article>
  </div>
</section>
<script src="translations/i18n.js"></script>
<script src="js/possible-mirror-page.js"></script>
</body>
</html>
