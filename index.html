<style>
:root{
  --page-w:min(100vw,75vh);
  --page-h:min(133.333333vw,100vh);
  --white:#f6fbff;
  --muted:rgba(226,239,250,.66);
  --glass:rgba(4,10,18,.72);
  --line:rgba(180,220,255,.15);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#000;color:var(--white)}
body{
  min-height:100vh;
  display:grid;
  place-items:center;
  overflow:hidden;
  font-family:'Vazirmatn',Tahoma,sans-serif;
  background:
    radial-gradient(circle at 50% 45%,rgba(5,32,58,.55),transparent 34%),
    radial-gradient(circle at 50% 50%,#03111d 0%,#000 66%);
}
button{font:inherit}
button:focus-visible{outline:2px solid #fff;outline-offset:4px}

.app{
  position:relative;
  width:var(--page-w);
  height:var(--page-h);
  aspect-ratio:3/4;
  overflow:hidden;
  isolation:isolate;
  background:#01050a;
  box-shadow:0 0 0 1px rgba(130,190,240,.12),0 30px 100px rgba(0,0,0,.9);
}
.app::before{
  content:"";
  position:absolute;inset:-15%;
  z-index:-3;
  background:
    radial-gradient(circle at 50% 44%,rgba(5,50,82,.75) 0%,rgba(2,20,34,.58) 28%,transparent 52%),
    radial-gradient(circle at 50% 50%,transparent 50%,rgba(0,0,0,.95) 79%);
}
.app::after{
  content:"";
  position:absolute;inset:0;
  z-index:20;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 42%,transparent 35%,rgba(0,0,0,.14) 61%,rgba(0,0,0,.65) 100%),
    linear-gradient(180deg,rgba(0,0,0,.16),transparent 22%,transparent 78%,rgba(0,0,0,.38));
}

.atmosphere{
  position:absolute;inset:0;pointer-events:none;opacity:.72;
  background:
    radial-gradient(circle at 12% 28%,rgba(0,104,180,.16) 0 1px,transparent 2px),
    radial-gradient(circle at 76% 18%,rgba(70,160,255,.13) 0 1px,transparent 2px),
    radial-gradient(circle at 82% 69%,rgba(0,120,220,.12) 0 1px,transparent 2px),
    radial-gradient(circle at 23% 78%,rgba(80,170,255,.1) 0 1px,transparent 2px);
  background-size:110px 130px,150px 170px,130px 160px,180px 150px;
  mix-blend-mode:screen;
}

.topbar{
  position:absolute;z-index:30;top:0;left:0;right:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:clamp(12px,3.2%,24px) clamp(14px,4.5%,30px);
  direction:rtl;
}
.brand{display:flex;flex-direction:column;gap:2px;text-shadow:0 2px 12px #000}
.brand strong{font-size:clamp(.8rem,2.3vw,1.05rem);font-weight:800;letter-spacing:.01em}
.brand span{font-size:clamp(.52rem,1.6vw,.72rem);opacity:.5;direction:ltr;text-align:right}
#x-social{position:absolute;z-index:35;right:0;top:100%;transform:none;direction:ltr;width:30px;height:30px}
.icon-btn{
  width:34px;height:34px;border-radius:50%;border:1px solid rgba(220,240,255,.14);
  color:#fff;background:rgba(0,0,0,.28);backdrop-filter:blur(8px);
  cursor:pointer;transition:.25s var(--ease);display:grid;place-items:center;
}
.icon-btn:hover{background:rgba(40,130,210,.2);border-color:rgba(150,220,255,.5);transform:translateY(-1px)}

.orbit{position:absolute;inset:0;display:grid;place-items:center;z-index:2}
.menu-svg{width:min(96vw,96vh);height:min(96vw,96vh);overflow:visible;position:relative;z-index:2outline:none;-webkit-tap-highlight-color:transparent}
.realm{cursor:pointer;transition:opacity .35s ease,filter .35s ease,transform .35s ease;transform-origin:500px 500px;outline:noneoutline:none!important;-webkit-tap-highlight-color:transparent}
.realm:focus,.realm:focus-visible{outline:none!important;box-shadow:none!important}
.realm:hover{filter:brightness(1.35) drop-shadow(0 0 18px currentColor)}
.realm-labels{pointer-events:none;position:relative;z-index:100}
.realm-label{pointer-events:none}
.realm.selected{filter:brightness(1.45) drop-shadow(0 0 25px currentColor)}
.ring-border{fill:none;stroke-width:2;vector-effect:non-scaling-stroke;opacity:.95}
.realm-title{fill:#fff;font-size:28px;font-weight:600;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.65);stroke-width:5px;stroke-linejoin:round}

#core{cursor:pointer;transition:transform .5s ease,filter .5s ease}
#core:hover{filter:brightness(1.3) drop-shadow(0 0 30px white)}
.logo-viewer{position:fixed;inset:0;z-index:500;display:none;place-items:center;background:rgba(0,0,0,.92);backdrop-filter:blur(14px);padding:5vh 5vw;cursor:zoom-out}.logo-viewer.open{display:grid}.logo-viewer img{display:block;width:min(82vw,82vh);height:min(82vw,82vh);max-width:900px;max-height:900px;object-fit:contain;border-radius:50%;box-shadow:0 0 80px rgba(255,215,0,.16);cursor:default}.logo-viewer-close{position:absolute;top:22px;right:22px;width:42px;height:42px;border:1px solid rgba(255,255,255,.3);border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:25px;line-height:1;cursor:pointer}.logo-viewer-close:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.6)}
@media(max-width:600px){.menu-svg{width:108vw;height:108vw}.realm-title{font-size:24px}}
.info{
  position:absolute;z-index:30;left:50%;bottom:3vh;transform:translateX(-50%);
  width:min(90%,650px);padding:18px 25px;
  border:1px solid rgba(255,255,255,.15);border-radius:18px;
  background:rgba(2,5,6,.72);backdrop-filter:blur(18px);
  box-shadow:0 16px 40px rgba(0,0,0,.35);text-align:center;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .35s ease,visibility .35s ease,transform .35s var(--ease);
}
.info.visible{opacity:1;visibility:visible;pointer-events:auto}
.info .kicker{font-size:clamp(.5rem,1.6vw,.68rem);letter-spacing:.16em;opacity:.45;margin-bottom:4px;direction:ltr}
.info h1{font-size:clamp(.9rem,3.2vw,1.35rem);margin-bottom:5px}
.info p{font-size:clamp(.55rem,1.75vw,.78rem);line-height:1.8;color:var(--muted);max-width:95%;margin:auto}


.info.reference{border-color:rgba(255,80,55,.26)}

.lang-switch{
  position:absolute;z-index:40;left:5%;top:4%;  display:flex;direction:ltr;border:1px solid rgba(220,240,255,.12);
  background:rgba(0,0,0,.28);border-radius:20px;padding:2px;backdrop-filter:blur(8px);
}
.lang-switch button{border:0;background:transparent;color:rgba(255,255,255,.48);padding:5px 8px;border-radius:16px;cursor:pointer;font-size:.62rem;font-weight:800}
.lang-switch button.active{background:rgba(255,255,255,.12);color:#fff}

.page{
  position:absolute;inset:0;
  width:100%;height:100%;aspect-ratio:3/4;
}
.page.book-page{z-index:100;display:none;background:#f3f4f2;color:#171918;overflow:hidden}
.book-shell{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.book-head{
  flex:0 0 auto;background:linear-gradient(135deg,#101214,#351818);
  color:#ffd8a4;padding:14px 15px 12px;display:flex;align-items:center;gap:9px;
  border-bottom:2px solid #c93a33;direction:rtl;
}
.book-head .book-title{font-weight:800;font-size:.83rem;flex:1}
.book-head .book-lang{display:flex;gap:4px;direction:ltr}
.book-head .book-lang button{background:rgba(255,255,255,.08);border:1px solid rgba(255,215,160,.25);color:#ffd8a4;padding:4px 7px;border-radius:12px;font-size:.62rem;font-weight:800;cursor:pointer}
.book-head .book-lang button.active{background:#ffd8a4;color:#241414}
.book-close{width:29px;height:29px;border-radius:50%;border:1px solid rgba(255,150,150,.35);background:rgba(255,80,80,.1);color:#ffb0aa;cursor:pointer}
.book-tabs{display:flex;gap:5px;overflow-x:auto;flex:0 0 auto;padding:9px;background:#e5e7e3;border-bottom:1px solid #cdd1cc}
.book-tabs::-webkit-scrollbar{height:4px}.book-tabs::-webkit-scrollbar-thumb{background:#aaa;border-radius:5px}
.book-tab{flex:0 0 auto;border:1px solid #c9cdc9;background:#fff;color:#5a5f5c;padding:6px 9px;border-radius:7px;font-size:.58rem;font-weight:800;cursor:pointer}
.book-tab.active{background:#2f6fd0;color:#fff;border-color:#2f6fd0}
.book-body{flex:1;min-height:0;overflow:auto;padding:22px 18px 40px;background:#f3f4f2;font-size:.82rem;line-height:2;color:#202321}
.book-body.lang-en{direction:ltr;text-align:left;font-family:Georgia,'Times New Roman',serif;line-height:1.75}
.book-body .book-h1{font-size:1.55rem;line-height:1.3;margin-bottom:2px;font-weight:800}
.book-body .book-sub{color:#626763;margin-bottom:22px;font-size:.8rem}
.chapter{margin-bottom:28px}
.chapter h2{display:flex;align-items:center;gap:8px;font-size:1rem;line-height:1.5;margin-bottom:13px}
.chapter h2 i{width:10px;height:10px;border-radius:50%;background:var(--dot,#2f6fd0);border:1px solid #bfc4bf;flex:none}
.chapter p{margin-bottom:14px;text-align:justify;text-align-last:right}
.book-body.lang-en .chapter p{text-align:justify;text-align-last:left}
.moral{margin-top:25px;padding:16px;border-top:2px solid #1d1f1e;background:rgba(47,111,208,.06);border-radius:9px}
.moral h2{color:#c93a33;margin-bottom:7px}
.moral p{font-weight:700;font-size:.88rem}

@media (max-width:520px){
  body{place-items:center}
  .menu-svg{width:108vw;height:108vw}
  .info{bottom:3vh;width:90%;padding:15px 18px}
}
@media (min-width:700px){
  .app{border-radius:4px}
}

/* ===== Modern Outlook — Optimized Cosmic Territory System ===== */
.home-page{background:radial-gradient(ellipse at 50% 45%,rgba(22,111,173,.16),transparent 58%),radial-gradient(circle at 15% 25%,rgba(103,62,220,.13),transparent 27%),radial-gradient(circle at 86% 26%,rgba(224,170,54,.12),transparent 27%),radial-gradient(circle at 14% 79%,rgba(207,69,48,.11),transparent 28%),radial-gradient(circle at 86% 80%,rgba(34,177,121,.12),transparent 28%),linear-gradient(145deg,#01040b 0%,#031426 40%,#020914 72%,#010308 100%)}

.app::after{background:radial-gradient(circle at 50% 47%,transparent 29%,rgba(0,0,0,.06) 56%,rgba(0,0,0,.68) 100%),linear-gradient(180deg,rgba(0,0,0,.18),transparent 18%,transparent 80%,rgba(0,0,0,.42))}
.atmosphere{opacity:.82;background:radial-gradient(circle at 7% 11%,rgba(255,255,255,.82) 0 1px,transparent 1.5px),radial-gradient(circle at 22% 37%,rgba(106,190,255,.62) 0 1px,transparent 1.6px),radial-gradient(circle at 42% 13%,rgba(255,220,137,.6) 0 1px,transparent 1.7px),radial-gradient(circle at 63% 23%,rgba(255,255,255,.58) 0 1px,transparent 1.5px),radial-gradient(circle at 82% 14%,rgba(150,208,255,.64) 0 1px,transparent 1.7px),radial-gradient(circle at 93% 43%,rgba(255,231,170,.58) 0 1px,transparent 1.6px),radial-gradient(circle at 14% 68%,rgba(214,133,255,.58) 0 1px,transparent 1.6px),radial-gradient(circle at 39% 83%,rgba(255,160,113,.52) 0 1px,transparent 1.5px),radial-gradient(circle at 67% 76%,rgba(111,255,194,.56) 0 1px,transparent 1.6px);background-size:103px 127px,149px 173px,127px 151px,173px 139px,131px 167px,157px 143px,139px 181px,167px 151px,151px 173px;mix-blend-mode:screen}
.core,.center-label{display:none}
.info{box-shadow:0 14px 34px rgba(0,0,0,.4)}

.info p{line-height:1.65}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}



/* ===== Landing page stability / interaction layer ===== */
html{width:100%;min-height:100%;background:#000}
body{width:100%;min-height:100vh;min-height:100dvh;overflow:hidden}
.app{contain:layout paint;overflow:hidden}
.home-page{overflow:hidden}
.menu-svg{touch-action:manipulation;user-select:none;-webkit-user-select:none}
.realm{outline:none}

.icon-btn,.lang-switch button{touch-action:manipulation}
@media (max-width:520px){
  .topbar{padding:12px 14px}
  #x-social{right:0;top:100%;transform:none;width:30px;height:30px}
  .lang-switch{top:12px;left:14px}
  .menu-svg{width:108vw;height:108vw}
  .info{bottom:3vh;width:90%;padding:12px 15px}
}

            "At first the sound was unpleasant. But after a few nights, its ears grew used to it, and then it saw that this voice, with all its roughness, possessed something none of those stolen voices had: endurance."

let lastToneAt=0;
function tone(freq=620){
  const nowMs=performance.now();
  if(nowMs-lastToneAt<120)return;
  lastToneAt=nowMs;
  try{
    if(!window.__audio) window.__audio=new (window.AudioContext||window.webkitAudioContext)();
    const ctx=window.__audio;
    if(ctx.state==='suspended') ctx.resume();
    const now=ctx.currentTime;
    const master=ctx.createGain();
    master.gain.setValueAtTime(.0001,now);
    master.gain.exponentialRampToValueAtTime(.055,now+.008);
    master.gain.exponentialRampToValueAtTime(.0001,now+.32);
    master.connect(ctx.destination);

    const osc=ctx.createOscillator(), shimmer=ctx.createOscillator(), sub=ctx.createOscillator();
    const filter=ctx.createBiquadFilter();
    const shimmerGain=ctx.createGain(), subGain=ctx.createGain();

    osc.type='sine';
    osc.frequency.setValueAtTime(freq*.72,now);
    osc.frequency.exponentialRampToValueAtTime(freq*1.08,now+.22);

    shimmer.type='triangle';
    shimmer.frequency.setValueAtTime(freq*2.04,now);
    shimmer.frequency.exponentialRampToValueAtTime(freq*1.55,now+.18);
    shimmerGain.gain.value=.12;

    sub.type='sine';
    sub.frequency.setValueAtTime(freq*.24,now);
    subGain.gain.value=.32;

    filter.type='lowpass';
    filter.frequency.setValueAtTime(2600,now);
    filter.frequency.exponentialRampToValueAtTime(700,now+.3);
    filter.Q.value=1.2;

    osc.connect(filter).connect(master);
    shimmer.connect(shimmerGain).connect(master);
    sub.connect(subGain).connect(master);
    osc.start(now);shimmer.start(now);sub.start(now);
    osc.stop(now+.34);shimmer.stop(now+.24);sub.stop(now+.3);
  }catch(e){}
}

function setInfo(id,show=true){
  activeId=id;
  realms.forEach(r=>r.classList.toggle('selected',r.dataset.id===id));
  const d=copy[uiLang][id];
  infoTitle.textContent=d.title;
  infoText.textContent=d.text;
  info.classList.toggle('reference',id==='reference');
  if(show) info.classList.add('visible');
  tone({structure:520,continuity:620,experience:720,reference:820,share:920,core:1040}[id]||620);
}

function clearInfo(){
  info.classList.remove('visible');
  realms.forEach(r=>r.classList.remove('selected'));
}

function selectRealm(id){
  if(id==='core'){
    setInfo('core');
    return;
  }
  const realm=realms.find(r=>r.dataset.id===id);
  if(!realm) return;
  setInfo(id);
  if(id==='share'){openShare();}
  if(id==='experience'){openExperience();}
  if(id==='continuity'){openContinuity();}
  if(id==='structure'){window.clearTimeout(window.__structureOpenTimer);openStructure();}
  if(id==='reference'){
    window.clearTimeout(window.__referenceOpenTimer);
    window.__referenceOpenTimer=window.setTimeout(openReference,220);
  }
}

const realmGeometry=[
  ['structure',365,445],
  ['continuity',285,365],
  ['experience',205,285],
  ['reference',125,205],
  ['share',70,125]
];
const universe=document.getElementById('universe');

function realmFromPoint(event){
  const rect=universe.getBoundingClientRect();
  const x=(event.clientX-rect.left)/rect.width*1000;
  const y=(event.clientY-rect.top)/rect.height*1000;
  const radius=Math.hypot(x-500,y-500);
  if(radius<=70)return 'core';
  for(const [id,inner,outer] of realmGeometry){
    if(radius>inner && radius<=outer)return id;
  }
  return null;
}

function activeChapters(){return bookLang==='en'?bookChaptersEn:bookChapters}

function buildBookTabs(active=0){
  bookTabs.innerHTML='';
  activeChapters().forEach((ch,i)=>{
    const b=document.createElement('button');
    b.className='book-tab'+(i===active?' active':'');
    b.textContent=ch.title;
    b.addEventListener('click',()=>selectChapter(i));
    bookTabs.appendChild(b);
  });
}

function selectChapter(i){
  const chapters=activeChapters();
  document.querySelectorAll('.book-tab').forEach((b,n)=>b.classList.toggle('active',n===i));
  const ch=chapters[i];
  let html='';
  if(i===0){
    html+=bookLang==='en'
      ? '<h1 class="book-h1">The Forgers of Imitation</h1><p class="book-sub">Ten Chapters</p>'
      : '<h1 class="book-h1">جاعلان تقلید</h1><p class="book-sub">در ده فصل</p>';
  }
  html+='<div class="chapter" style="--dot:'+ch.dot+'"><h2><i></i>'+ch.title+'</h2>';
  ch.paragraphs.forEach(p=>html+='<p>'+p+'</p>');
  html+='</div>';
  if(i===chapters.length-1){
    html+='<div class="moral"><h2>'+(bookLang==='en'?'Fable Wisdom':'حکمت فابل')+'</h2><p>'+(bookLang==='en'?bookMoralEn:bookMoralFa)+'</p></div>';
  }
  bookBody.classList.toggle('lang-en',bookLang==='en');
  bookBody.dir=bookLang==='en'?'ltr':'rtl';
  bookBody.innerHTML=html;
  bookBody.scrollTop=0;
}

  if(e.key==='Escape'&&bookPage.style.display==='block')closeBook();
  if(e.key==='Escape'&&sharePage.style.display==='block')closeShare();
  if(e.key==='Escape'&&experiencePage.style.display==='block')closeExperience();
  if(e.key==='Escape'&&continuityPage.style.display==='block')closeContinuity();
  if(e.key==='Escape'&&structurePage.style.display==='block')closeStructure();
  if(e.key==='Escape'&&referencePage.style.display==='block')closeReference();
  if(logoViewer.classList.contains('open')||bookPage.style.display==='block'||referencePage.style.display==='block'||structurePage.style.display==='block'||continuityPage.style.display==='block'||experiencePage.style.display==='block'||sharePage.style.display==='block')return;
  const order=['structure','continuity','experience','reference','share'];
  const idx=order.indexOf(activeId);
  if(['ArrowDown','ArrowRight'].includes(e.key)){e.preventDefault();setInfo(order[(idx+1)%order.length])}
  if(['ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();setInfo(order[(idx-1+order.length)%order.length])}

});
