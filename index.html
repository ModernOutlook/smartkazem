<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02060c">
<title>نگرش نوین — Modern Outlook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --page-w:min(92vw, 72vh);
  --page-h:calc(var(--page-w) * 1.3333333);
  --white:#f6fbff;
  --muted:rgba(226,239,250,.66);
  --glass:rgba(4,10,18,.72);
  --line:rgba(180,220,255,.15);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#000;color:var(--white)}
body{
  min-height:100vh;
  display:grid;
  place-items:center;
  overflow:hidden;
  font-family:'Vazirmatn',Tahoma,sans-serif;
  background:
    radial-gradient(circle at 50% 45%,rgba(5,32,58,.55),transparent 34%),
    radial-gradient(circle at 50% 50%,#03111d 0%,#000 66%);
}
button{font:inherit}
button:focus-visible{outline:2px solid #fff;outline-offset:4px}

.app{
  position:relative;
  width:var(--page-w);
  height:var(--page-h);
  max-width:100vw;
  max-height:100vh;
  aspect-ratio:3/4;
  overflow:hidden;
  isolation:isolate;
  background:#01050a;
  box-shadow:0 0 0 1px rgba(130,190,240,.12),0 30px 100px rgba(0,0,0,.9);
}
.app::before{
  content:"";
  position:absolute;inset:-15%;
  z-index:-3;
  background:
    radial-gradient(circle at 50% 44%,rgba(5,50,82,.75) 0%,rgba(2,20,34,.58) 28%,transparent 52%),
    radial-gradient(circle at 50% 50%,transparent 50%,rgba(0,0,0,.95) 79%);
}
.app::after{
  content:"";
  position:absolute;inset:0;
  z-index:20;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 42%,transparent 35%,rgba(0,0,0,.14) 61%,rgba(0,0,0,.65) 100%),
    linear-gradient(180deg,rgba(0,0,0,.16),transparent 22%,transparent 78%,rgba(0,0,0,.38));
}

.atmosphere{
  position:absolute;inset:0;pointer-events:none;opacity:.72;
  background:
    radial-gradient(circle at 12% 28%,rgba(0,104,180,.16) 0 1px,transparent 2px),
    radial-gradient(circle at 76% 18%,rgba(70,160,255,.13) 0 1px,transparent 2px),
    radial-gradient(circle at 82% 69%,rgba(0,120,220,.12) 0 1px,transparent 2px),
    radial-gradient(circle at 23% 78%,rgba(80,170,255,.1) 0 1px,transparent 2px);
  background-size:110px 130px,150px 170px,130px 160px,180px 150px;
  mix-blend-mode:screen;
}

.topbar{
  position:absolute;z-index:30;top:0;left:0;right:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:clamp(12px,3.2%,24px) clamp(14px,4.5%,30px);
  direction:rtl;
}
.brand{display:flex;flex-direction:column;gap:2px;text-shadow:0 2px 12px #000}
.brand strong{font-size:clamp(.8rem,2.3vw,1.05rem);font-weight:800;letter-spacing:.01em}
.brand span{font-size:clamp(.52rem,1.6vw,.72rem);opacity:.5;direction:ltr;text-align:right}
.page-actions{display:flex;gap:7px}
.icon-btn{
  width:34px;height:34px;border-radius:50%;border:1px solid rgba(220,240,255,.14);
  color:#fff;background:rgba(0,0,0,.28);backdrop-filter:blur(8px);
  cursor:pointer;transition:.25s var(--ease);display:grid;place-items:center;
}
.icon-btn:hover{background:rgba(40,130,210,.2);border-color:rgba(150,220,255,.5);transform:translateY(-1px)}

.orbit{
  position:absolute;inset:0;display:grid;place-items:center;
}
.rings{
  position:relative;
  width:82%;
  aspect-ratio:1;
  transform:translateY(-1%);
}
.ring{
  --c:#49a9ff;
  --nebula:#8ad8ff;
  position:absolute;left:50%;top:50%;
  width:var(--size);height:var(--size);
  transform:translate(-50%,-50%);
  border:0;border-radius:50%;
  cursor:pointer;appearance:none;
  -webkit-tap-highlight-color:transparent;
  background:
    radial-gradient(circle at 32% 24%,rgba(255,255,255,.72) 0 .22%,transparent .5%),
    radial-gradient(circle at 68% 31%,rgba(255,255,255,.58) 0 .18%,transparent .48%),
    radial-gradient(circle at 76% 67%,rgba(255,255,255,.5) 0 .16%,transparent .42%),
    radial-gradient(circle at 25% 73%,rgba(255,255,255,.42) 0 .14%,transparent .4%),
    radial-gradient(ellipse at 50% 50%,transparent 0 61%,var(--c) 62%,var(--nebula) 66%,rgba(0,0,0,.2) 72%,transparent 76%),
    radial-gradient(circle at 40% 38%,color-mix(in srgb,var(--nebula) 32%,transparent),transparent 31%),
    radial-gradient(circle at 66% 62%,color-mix(in srgb,var(--c) 30%,transparent),transparent 38%),
    #010914;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.08),
    0 0 24px var(--glow),
    0 0 70px color-mix(in srgb,var(--glow) 58%,transparent),
    inset 0 0 32px rgba(255,255,255,.08);
  transition:filter .35s var(--ease),transform .35s var(--ease),box-shadow .35s var(--ease);
  z-index:var(--z);
  animation:nebulaDrift var(--orbit-speed,18s) ease-in-out infinite alternate;
  overflow:visible;
}
.ring::before{
  content:"";position:absolute;inset:-1.5%;border-radius:50%;pointer-events:none;
  background:
    repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.15) 0 1px,transparent 1.5px 13px),
    radial-gradient(ellipse at 34% 28%,rgba(255,255,255,.2),transparent 24%),
    radial-gradient(ellipse at 68% 70%,var(--nebula),transparent 30%);
  mix-blend-mode:screen;
  opacity:.58;
  filter:blur(.35px);
  animation:starField var(--star-speed,24s) linear infinite;
}
.ring::after{
  content:"";position:absolute;inset:-7%;border-radius:50%;pointer-events:none;
  border:1px solid color-mix(in srgb,var(--nebula) 62%,transparent);
  box-shadow:
    0 0 18px var(--glow),
    0 0 42px color-mix(in srgb,var(--glow) 55%,transparent),
    inset 0 0 16px color-mix(in srgb,var(--nebula) 30%,transparent);
  opacity:.8;
  animation:ringPulse 4.8s ease-in-out infinite;
}
@keyframes nebulaDrift{
  0%{transform:translate(-50%,-50%) rotate(-1deg) scale(.995)}
  100%{transform:translate(-50%,-50%) rotate(1deg) scale(1.008)}
}
@keyframes starField{
  0%{transform:rotate(0deg) scale(1)}
  100%{transform:rotate(18deg) scale(1.035)}
}
@keyframes ringPulse{
  0%,100%{opacity:.52;filter:blur(0)}
  50%{opacity:.92;filter:blur(.35px)}
}
.ring:hover{filter:brightness(1.22) saturate(1.18)}
.ring.active{
  filter:brightness(1.28) saturate(1.2);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.14),
    0 0 48px var(--glow),
    0 0 100px color-mix(in srgb,var(--glow) 48%,transparent),
    inset 0 0 30px rgba(255,255,255,.15);
}
.ring-structure{--size:100%;--c:#063d52;--nebula:#28bfff;--glow:rgba(5,104,137,.58);--z:1;--orbit-speed:22s;--star-speed:31s}
.ring-continuity{--size:81%;--c:#c79a24;--nebula:#ffe38a;--glow:rgba(218,171,45,.5);--z:2;--orbit-speed:19s;--star-speed:27s}
.ring-experience{--size:63%;--c:#6b238f;--nebula:#d96cff;--glow:rgba(126,48,174,.58);--z:3;--orbit-speed:17s;--star-speed:23s}
.ring-reference{--size:46%;--c:#8f3a32;--nebula:#ff806f;--glow:rgba(171,68,56,.55);--z:4;--orbit-speed:15s;--star-speed:21s}
.ring-share{--size:29%;--c:#087d4f;--nebula:#5dffba;--glow:rgba(20,172,111,.55);--z:5;--orbit-speed:13s;--star-speed:19s}
.core{
  position:absolute;z-index:8;left:50%;top:50%;
  width:11%;aspect-ratio:1;transform:translate(-50%,-50%);
  border-radius:50%;border:0;cursor:pointer;
  background:radial-gradient(circle,#fff 0 18%,#fffce1 35%,rgba(255,248,160,.55) 53%,transparent 72%);
  box-shadow:0 0 24px 8px rgba(255,250,205,.7),0 0 62px 18px rgba(255,230,120,.28);
  animation:corePulse 3.4s ease-in-out infinite;
}
@keyframes corePulse{0%,100%{transform:translate(-50%,-50%) scale(.94);opacity:.9}50%{transform:translate(-50%,-50%) scale(1.06);opacity:1}}

.ring-label{
  position:absolute;
  top:50%;
  width:max-content;
  min-width:max-content;
  transform:translateY(-50%);
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:center;
  gap:6px;
  color:#fff;
  text-shadow:0 2px 10px #000,0 0 9px rgba(0,0,0,.95);
  pointer-events:none;
  white-space:nowrap;
  z-index:3;
}
.ring-label .label-icon{
  width:clamp(18px,4.2vw,30px);
  height:clamp(18px,4.2vw,30px);
  flex:none;
  filter:drop-shadow(0 0 4px rgba(255,255,255,.5));
}
.ring-label span{
  font-size:clamp(.55rem,2.15vw,.9rem);
  font-weight:800;
  line-height:1.2;
}

/* Titles sit on the horizontal diameter, alternating left/right by territory. */
.ring-structure .ring-label,
.ring-experience .ring-label,
.ring-share .ring-label{
  right:calc(100% + 12px);
}
.ring-continuity .ring-label,
.ring-reference .ring-label{
  left:calc(100% + 12px);
}
.ring-structure .ring-label,
.ring-experience .ring-label,
.ring-share .ring-label{
  flex-direction:row-reverse;
}
.ring-continuity .ring-label,
.ring-reference .ring-label{
  flex-direction:row;
}

.center-label{
  position:absolute;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);
  width:34%;text-align:center;color:#fff;text-shadow:0 2px 9px #000;
  pointer-events:none;opacity:0;transition:.25s;
}
.core.active + .center-label{opacity:1}
.center-label strong{display:block;font-size:clamp(.55rem,1.9vw,.8rem)}
.center-label small{display:block;opacity:.58;font-size:clamp(.45rem,1.3vw,.62rem);direction:ltr}

.info{
  position:absolute;z-index:30;left:5%;right:5%;bottom:5%;
  min-height:15%;padding:clamp(12px,3.2%,20px) clamp(14px,4%,22px);
  border:1px solid var(--line);border-radius:18px;
  background:linear-gradient(180deg,rgba(4,13,23,.74),rgba(2,7,13,.82));
  backdrop-filter:blur(12px);box-shadow:0 16px 40px rgba(0,0,0,.35);
  text-align:center;transition:transform .35s var(--ease),opacity .25s;
}
.info .kicker{font-size:clamp(.5rem,1.6vw,.68rem);letter-spacing:.16em;opacity:.45;margin-bottom:4px;direction:ltr}
.info h1{font-size:clamp(.9rem,3.2vw,1.35rem);margin-bottom:5px}
.info p{font-size:clamp(.55rem,1.75vw,.78rem);line-height:1.8;color:var(--muted);max-width:95%;margin:auto}
.info .tap{display:inline-block;margin-top:7px;font-size:.56rem;opacity:.35}
.info.reference{border-color:rgba(255,80,55,.26)}
.info.reference .tap{color:#ffb1a7;opacity:.7}

.lang-switch{
  position:absolute;z-index:40;left:5%;top:4%;
  display:flex;direction:ltr;border:1px solid rgba(220,240,255,.12);
  background:rgba(0,0,0,.28);border-radius:20px;padding:2px;backdrop-filter:blur(8px);
}
.lang-switch button{border:0;background:transparent;color:rgba(255,255,255,.48);padding:5px 8px;border-radius:16px;cursor:pointer;font-size:.62rem;font-weight:800}
.lang-switch button.active{background:rgba(255,255,255,.12);color:#fff}

.page{
  position:absolute;inset:0;
  width:100%;height:100%;aspect-ratio:3/4;
}
.page.book-page{z-index:100;display:none;background:#f3f4f2;color:#171918;overflow:hidden}
.book-shell{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.book-head{
  flex:0 0 auto;background:linear-gradient(135deg,#101214,#351818);
  color:#ffd8a4;padding:14px 15px 12px;display:flex;align-items:center;gap:9px;
  border-bottom:2px solid #c93a33;direction:rtl;
}
.book-head .book-title{font-weight:800;font-size:.83rem;flex:1}
.book-head .book-lang{display:flex;gap:4px;direction:ltr}
.book-head .book-lang button{background:rgba(255,255,255,.08);border:1px solid rgba(255,215,160,.25);color:#ffd8a4;padding:4px 7px;border-radius:12px;font-size:.62rem;font-weight:800;cursor:pointer}
.book-head .book-lang button.active{background:#ffd8a4;color:#241414}
.book-close{width:29px;height:29px;border-radius:50%;border:1px solid rgba(255,150,150,.35);background:rgba(255,80,80,.1);color:#ffb0aa;cursor:pointer}
.book-tabs{display:flex;gap:5px;overflow-x:auto;flex:0 0 auto;padding:9px;background:#e5e7e3;border-bottom:1px solid #cdd1cc}
.book-tabs::-webkit-scrollbar{height:4px}.book-tabs::-webkit-scrollbar-thumb{background:#aaa;border-radius:5px}
.book-tab{flex:0 0 auto;border:1px solid #c9cdc9;background:#fff;color:#5a5f5c;padding:6px 9px;border-radius:7px;font-size:.58rem;font-weight:800;cursor:pointer}
.book-tab.active{background:#2f6fd0;color:#fff;border-color:#2f6fd0}
.book-body{flex:1;min-height:0;overflow:auto;padding:22px 18px 40px;background:#f3f4f2;font-size:.82rem;line-height:2;color:#202321}
.book-body.lang-en{direction:ltr;text-align:left;font-family:Georgia,'Times New Roman',serif;line-height:1.75}
.book-body .book-h1{font-size:1.55rem;line-height:1.3;margin-bottom:2px;font-weight:800}
.book-body .book-sub{color:#626763;margin-bottom:22px;font-size:.8rem}
.chapter{margin-bottom:28px}
.chapter h2{display:flex;align-items:center;gap:8px;font-size:1rem;line-height:1.5;margin-bottom:13px}
.chapter h2 i{width:10px;height:10px;border-radius:50%;background:var(--dot,#2f6fd0);border:1px solid #bfc4bf;flex:none}
.chapter p{margin-bottom:14px;text-align:justify;text-align-last:right}
.book-body.lang-en .chapter p{text-align:justify;text-align-last:left}
.moral{margin-top:25px;padding:16px;border-top:2px solid #1d1f1e;background:rgba(47,111,208,.06);border-radius:9px}
.moral h2{color:#c93a33;margin-bottom:7px}
.moral p{font-weight:700;font-size:.88rem}

@media (max-width:520px){
  :root{--page-w:100vw}
  body{place-items:center}
  .app{width:100vw;height:133.333vw;max-height:100vh}
  .rings{width:80%}
  .info{bottom:4.2%;min-height:14%}
}
@media (min-width:700px){
  .app{border-radius:4px}
}

/* ===== Modern Outlook — Cosmic Home Redesign ===== */
.home-page{
  background:
    radial-gradient(ellipse at 50% 47%, rgba(20,100,155,.18) 0%, rgba(5,30,52,.10) 28%, transparent 55%),
    radial-gradient(circle at 18% 29%, rgba(105,54,210,.20) 0%, transparent 27%),
    radial-gradient(circle at 84% 29%, rgba(210,157,46,.18) 0%, transparent 28%),
    radial-gradient(circle at 18% 78%, rgba(191,62,42,.17) 0%, transparent 28%),
    radial-gradient(circle at 83% 78%, rgba(36,168,116,.19) 0%, transparent 28%),
    linear-gradient(145deg,#01050d 0%,#031225 38%,#020914 68%,#01040a 100%);
}
.app::before{
  background:
    radial-gradient(ellipse at 50% 50%,rgba(12,83,128,.22) 0%,rgba(2,19,34,.08) 38%,transparent 65%),
    radial-gradient(circle at 50% 50%,transparent 45%,rgba(0,0,0,.72) 88%);
}
.app::after{
  background:
    radial-gradient(circle at 50% 48%,transparent 31%,rgba(0,0,0,.08) 58%,rgba(0,0,0,.72) 100%),
    linear-gradient(180deg,rgba(0,0,0,.24),transparent 18%,transparent 82%,rgba(0,0,0,.46));
}
.atmosphere{
  opacity:.9;
  background:
    radial-gradient(circle at 8% 12%,rgba(255,255,255,.85) 0 1px,transparent 1.6px),
    radial-gradient(circle at 22% 38%,rgba(106,190,255,.72) 0 1px,transparent 1.7px),
    radial-gradient(circle at 41% 13%,rgba(255,220,137,.72) 0 1px,transparent 1.8px),
    radial-gradient(circle at 63% 23%,rgba(255,255,255,.65) 0 1px,transparent 1.6px),
    radial-gradient(circle at 81% 14%,rgba(150,208,255,.75) 0 1px,transparent 1.8px),
    radial-gradient(circle at 92% 42%,rgba(255,231,170,.72) 0 1px,transparent 1.7px),
    radial-gradient(circle at 14% 68%,rgba(214,133,255,.7) 0 1px,transparent 1.7px),
    radial-gradient(circle at 39% 83%,rgba(255,160,113,.62) 0 1px,transparent 1.6px),
    radial-gradient(circle at 67% 76%,rgba(111,255,194,.68) 0 1px,transparent 1.7px),
    radial-gradient(circle at 89% 88%,rgba(255,255,255,.72) 0 1px,transparent 1.7px);
  background-size:103px 127px,149px 173px,127px 151px,173px 139px,131px 167px,157px 143px,139px 181px,167px 151px,151px 173px,191px 157px;
  mix-blend-mode:screen;
}
.rings{
  width:88%;
  transform:translateY(-2%);
  filter:drop-shadow(0 0 22px rgba(52,151,220,.10));
}
.ring{
  background:
    radial-gradient(circle at 30% 22%,rgba(255,255,255,.95) 0 .16%,transparent .48%),
    radial-gradient(circle at 71% 30%,rgba(255,255,255,.76) 0 .14%,transparent .45%),
    radial-gradient(circle at 77% 68%,rgba(255,255,255,.72) 0 .13%,transparent .43%),
    radial-gradient(circle at 24% 74%,rgba(255,255,255,.64) 0 .12%,transparent .42%),
    repeating-radial-gradient(circle at 50% 50%,transparent 0 43%,rgba(255,255,255,.025) 43.3% 43.8%,transparent 44% 100%),
    radial-gradient(ellipse at 50% 50%,transparent 0 55%,rgba(0,0,0,.04) 55.5%,var(--c) 58%,var(--nebula) 63%,rgba(255,255,255,.24) 64%,transparent 69%),
    radial-gradient(circle at 39% 36%,color-mix(in srgb,var(--nebula) 24%,transparent),transparent 34%),
    radial-gradient(circle at 66% 64%,color-mix(in srgb,var(--c) 24%,transparent),transparent 42%),
    transparent;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.045),
    0 0 18px var(--glow),
    0 0 54px color-mix(in srgb,var(--glow) 58%,transparent),
    inset 0 0 24px rgba(255,255,255,.035);
  border:0;
}
.ring::before{
  inset:-2.2%;
  background:
    repeating-conic-gradient(from 0deg,rgba(255,255,255,.22) 0deg .45deg,transparent .45deg 7deg),
    radial-gradient(ellipse at 34% 26%,rgba(255,255,255,.18),transparent 23%),
    radial-gradient(ellipse at 68% 72%,var(--nebula),transparent 29%);
  opacity:.68;
  filter:blur(.25px);
  animation:starField var(--star-speed,24s) linear infinite;
}
.ring::after{
  inset:-5%;
  border:1.5px solid color-mix(in srgb,var(--nebula) 70%,transparent);
  box-shadow:
    0 0 14px var(--glow),
    0 0 38px color-mix(in srgb,var(--glow) 62%,transparent),
    inset 0 0 12px color-mix(in srgb,var(--nebula) 28%,transparent);
  opacity:.9;
}
.ring-structure{--size:100%;--c:#12658c;--nebula:#45c9ff;--glow:rgba(30,163,225,.48);--z:1;--orbit-speed:22s;--star-speed:31s}
.ring-continuity{--size:80%;--c:#b27d19;--nebula:#ffe08a;--glow:rgba(230,176,45,.46);--z:2;--orbit-speed:19s;--star-speed:27s}
.ring-experience{--size:60%;--c:#6c2990;--nebula:#dc76ff;--glow:rgba(164,67,219,.48);--z:3;--orbit-speed:17s;--star-speed:23s}
.ring-reference{--size:40%;--c:#9b3d30;--nebula:#ff866d;--glow:rgba(208,76,57,.46);--z:4;--orbit-speed:15s;--star-speed:21s}
.ring-share{--size:21%;--c:#0d8458;--nebula:#68ffc2;--glow:rgba(33,192,126,.48);--z:5;--orbit-speed:13s;--star-speed:19s}
.ring-label{
  top:50%;
  width:clamp(30px,7vw,44px);
  min-width:0;
  height:clamp(30px,7vw,44px);
  padding:6px;
  border:1px solid rgba(255,255,255,.22);
  border-radius:50%;
  background:rgba(2,8,15,.48);
  backdrop-filter:blur(5px);
  box-shadow:0 0 14px color-mix(in srgb,var(--glow) 55%,transparent),inset 0 0 10px rgba(255,255,255,.06);
}
.ring-label span{display:none}
.ring-label .label-icon{width:100%;height:100%;filter:drop-shadow(0 0 5px rgba(255,255,255,.65))}
.ring-structure .ring-label,
.ring-experience .ring-label,
.ring-share .ring-label{right:auto;left:50%;transform:translate(-50%,-50%);}
.ring-continuity .ring-label,
.ring-reference .ring-label{left:50%;transform:translate(-50%,-50%);}
.ring-structure .ring-label,
.ring-experience .ring-label,
.ring-share .ring-label,
.ring-continuity .ring-label,
.ring-reference .ring-label{flex-direction:row;}
.ring-share .ring-label{width:clamp(27px,6vw,38px);height:clamp(27px,6vw,38px);}
.info{
  background:linear-gradient(180deg,rgba(3,13,25,.62),rgba(1,6,13,.82));
  border-color:rgba(117,192,239,.16);
  box-shadow:0 18px 46px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.035);

            "The arena, which had once swallowed every competition, was still there. But the condition for entering it had changed. No one had to be better than anyone else, or better at pretending to be. All that was required was to be what one was, and a little more each day. Each one's share was the share of the whole forest, and because everyone had a share, no one needed to take another's.",
            "One night, with the moon resting on the pond, the old myna, who was no longer anyone's master—and was content with that—was asked by a chick, “Why did we spend all those years imitating?” It said, “Because we were afraid someone would discover what we really were. Then we became afraid someone would discover that we did not know.”",
            "The chick was silent. The myna continued: “But there was no one to discover it. We were all watching one another.”"
        ]
    }
];

const bookMoralEn = "The one who displays a skill goes only as far as there are spectators; the one who practices a skill goes as far as they themselves can go. And a forest where everyone is a spectator eventually has nothing left to see but the act of watching itself.";
const bookMoralFa = 'آنکه مهارت را نمایش می‌دهد، فقط تا آنجا می‌رود که تماشاگر دارد؛ آنکه مهارت را می‌ورزد، تا آنجا که خودش می‌رود. و جنگلی که همه در آن تماشاگرند، سرانجام جز خودِ تماشا چیزی برای دیدن ندارد.';

const copy = {
  fa:{
    structure:{title:'ساختار تالار',text:'لایه‌ی بیرونی، چارچوب و ساختار کلی تالار را نمایندگی می‌کند.',tap:'برای انتخاب، روی حلقه بزنید'},
    continuity:{title:'تداوم عالم',text:'حلقه‌ی طلایی، تداوم و پیوستگی جریان عالم را نمایندگی می‌کند.',tap:'برای انتخاب، روی حلقه بزنید'},
    experience:{title:'قلمرو تجربه',text:'این لایه به تجربه، آگاهی و دانشی اشاره دارد که در مسیر زیستن شکل می‌گیرد.',tap:'برای انتخاب، روی حلقه بزنید'},
    reference:{title:'مرجع تقلید',text:'مرجع الگوها و منابع تقلید. با انتخاب این حلقه، کتاب «جاعلان تقلید» باز می‌شود.',tap:'برای ورود به کتاب بزنید'},
    share:{title:'اقتصاد سهم',text:'لایه‌ی مرکزیِ سهم و توزیع منابع؛ جایی که ارزش، مشارکت و سهم‌مندی به هم می‌رسند.',tap:'برای انتخاب، روی حلقه بزنید'},
    core:{title:'نگرش نوین',text:'مرکز روشن ساختار؛ نقطه‌ی همگرایی همه‌ی لایه‌ها و نام این تجربه.',tap:'برای بازگشت به مرکز بزنید'}
  },
  en:{
    structure:{title:'Hall Structure',text:'The outer layer represents the hall’s overall structure, framework, and foundations.',tap:'Tap a ring to select it'},
    continuity:{title:'Continuity of the Universe',text:'The golden layer represents continuity and the ongoing flow of the universe.',tap:'Tap a ring to select it'},
    experience:{title:'Realm of Experience',text:'This layer represents experience, awareness, and knowledge formed through living.',tap:'Tap a ring to select it'},
    reference:{title:'Reference of Imitation',text:'The layer of models and sources of imitation. Select it to open “The Forgers of Imitation.”',tap:'Tap to enter the book'},
    share:{title:'Share Economy',text:'The central layer of shares and distribution, where value, participation, and ownership meet.',tap:'Tap a ring to select it'},
    core:{title:'Modern Outlook',text:'The luminous center where all layers converge — the name of this experience.',tap:'Tap to return to the center'}
  }
};

let uiLang='fa';
let bookLang='fa';
let activeId='structure';

const app=document.getElementById('app');
const info=document.getElementById('info');
const infoTitle=document.getElementById('info-title');
const infoText=document.getElementById('info-text');
const infoTap=document.getElementById('info-tap');
const rings=[...document.querySelectorAll('.ring')];
const core=document.getElementById('core');
const centerLabel=document.getElementById('center-label');

function tone(freq=620){
  try{
    if(!window.__audio) window.__audio=new (window.AudioContext||window.webkitAudioContext)();
    const ctx=window.__audio;
    if(ctx.state==='suspended') ctx.resume();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';o.frequency.setValueAtTime(freq,ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(freq*1.35,ctx.currentTime+.08);
    g.gain.setValueAtTime(.035,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.14);
    o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.15);
  }catch(e){}
}

function setInfo(id){
  activeId=id;
  rings.forEach(r=>r.classList.toggle('active',r.dataset.id===id));
  core.classList.toggle('active',id==='core');
  const d=copy[uiLang][id];
  infoTitle.textContent=d.title;
  infoText.textContent=d.text;
  infoTap.textContent=d.tap;
  info.classList.toggle('reference',id==='reference');
  centerLabel.style.opacity=id==='core'?'1':'0';
  tone({structure:520,continuity:620,experience:720,reference:820,share:920,core:1040}[id]||620);
}

rings.forEach(r=>{
  r.addEventListener('click',()=>{
    const id=r.dataset.id;
    setInfo(id);
    if(id==='reference') setTimeout(openBook,220);
  });
});

core.addEventListener('click',()=>setInfo('core'));

document.getElementById('fullscreen').addEventListener('click',()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{});
  else document.exitFullscreen?.().catch(()=>{});
});

function setUiLanguage(lang){
  uiLang=lang;
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='fa'?'rtl':'ltr';
  document.getElementById('ui-fa').classList.toggle('active',lang==='fa');
  document.getElementById('ui-en').classList.toggle('active',lang==='en');
  document.querySelectorAll('[data-fa][data-en]').forEach(el=>el.textContent=el.dataset[lang]);
  const current=copy[lang][activeId];
  infoTitle.textContent=current.title;
  infoText.textContent=current.text;
  infoTap.textContent=current.tap;
  if(lang==='en'){
    document.querySelector('.brand strong').textContent='Modern Outlook';
    document.querySelector('.brand span').textContent='نگرش نوین';
  }else{
    document.querySelector('.brand strong').textContent='نگرش نوین';
    document.querySelector('.brand span').textContent='Modern Outlook';
  }
}
document.getElementById('ui-fa').addEventListener('click',()=>setUiLanguage('fa'));
document.getElementById('ui-en').addEventListener('click',()=>setUiLanguage('en'));

const home=document.getElementById('home-page');
const bookPage=document.getElementById('book-page');
const bookTabs=document.getElementById('book-tabs');
const bookBody=document.getElementById('book-body');

function activeChapters(){return bookLang==='en'?bookChaptersEn:bookChapters}

function buildBookTabs(active=0){
  bookTabs.innerHTML='';
  activeChapters().forEach((ch,i)=>{
    const b=document.createElement('button');
    b.className='book-tab'+(i===active?' active':'');
    b.textContent=ch.title;
    b.addEventListener('click',()=>selectChapter(i));
    bookTabs.appendChild(b);
  });
}

function selectChapter(i){
  const chapters=activeChapters();
  document.querySelectorAll('.book-tab').forEach((b,n)=>b.classList.toggle('active',n===i));
  const ch=chapters[i];
  let html='';
  if(i===0){
    html+=bookLang==='en'
      ? '<h1 class="book-h1">The Forgers of Imitation</h1><p class="book-sub">Ten Chapters</p>'
      : '<h1 class="book-h1">جاعلان تقلید</h1><p class="book-sub">در ده فصل</p>';
  }
  html+='<div class="chapter" style="--dot:'+ch.dot+'"><h2><i></i>'+ch.title+'</h2>';
  ch.paragraphs.forEach(p=>html+='<p>'+p+'</p>');
  html+='</div>';
  if(i===chapters.length-1){
    html+='<div class="moral"><h2>'+(bookLang==='en'?'Fable Wisdom':'حکمت فابل')+'</h2><p>'+(bookLang==='en'?bookMoralEn:bookMoralFa)+'</p></div>';
  }
  bookBody.classList.toggle('lang-en',bookLang==='en');
  bookBody.dir=bookLang==='en'?'ltr':'rtl';
  bookBody.innerHTML=html;
  bookBody.scrollTop=0;
}

function openBook(){
  home.style.display='none';
  bookPage.style.display='block';
  buildBookTabs(0);
  selectChapter(0);
  tone(880);
}

function closeBook(){
  bookPage.style.display='none';
  home.style.display='block';
  setInfo('reference');
  tone(560);
}

document.getElementById('book-close').addEventListener('click',closeBook);
document.getElementById('book-fa').addEventListener('click',()=>{
  if(bookLang==='fa')return;
  const idx=Math.max(0,[...document.querySelectorAll('.book-tab')].findIndex(b=>b.classList.contains('active')));
  bookLang='fa';
  document.getElementById('book-fa').classList.add('active');
  document.getElementById('book-en').classList.remove('active');
  document.getElementById('book-title').textContent='📖 جاعلان تقلید — در ده فصل';
  buildBookTabs(idx);selectChapter(idx);
});
document.getElementById('book-en').addEventListener('click',()=>{
  if(bookLang==='en')return;
  const idx=Math.max(0,[...document.querySelectorAll('.book-tab')].findIndex(b=>b.classList.contains('active')));
  bookLang='en';
  document.getElementById('book-en').classList.add('active');
  document.getElementById('book-fa').classList.remove('active');
  document.getElementById('book-title').textContent='📖 The Forgers of Imitation — Ten Chapters';
  buildBookTabs(idx);selectChapter(idx);
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&bookPage.style.display==='block')closeBook();
  if(bookPage.style.display==='block')return;
  const order=['structure','continuity','experience','reference','share','core'];
  const idx=order.indexOf(activeId);
  if(['ArrowDown','ArrowRight'].includes(e.key)){e.preventDefault();setInfo(order[(idx+1)%order.length])}
  if(['ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();setInfo(order[(idx-1+order.length)%order.length])}
  if(e.key==='Enter'&&activeId==='reference')openBook();
});

setUiLanguage('fa');
setInfo('structure');
</script>
