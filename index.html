<style>
:root{
  --page-w:min(100vw,75vh);
  --page-h:min(133.333333vw,100vh);
  --white:#f6fbff;
  --muted:rgba(226,239,250,.66);
  --glass:rgba(4,10,18,.72);
  --line:rgba(180,220,255,.15);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#000;color:var(--white)}
body{
  min-height:100vh;
  display:grid;
  place-items:center;
  overflow:hidden;
  font-family:'Vazirmatn',Tahoma,sans-serif;
  background:
    radial-gradient(circle at 50% 45%,rgba(5,32,58,.55),transparent 34%),
    radial-gradient(circle at 50% 50%,#03111d 0%,#000 66%);
}
button{font:inherit}
button:focus-visible{outline:2px solid #fff;outline-offset:4px}

.app{
  position:relative;
  width:var(--page-w);
  height:var(--page-h);
  aspect-ratio:3/4;
  overflow:hidden;
  isolation:isolate;
  background:#01050a;
  box-shadow:0 0 0 1px rgba(130,190,240,.12),0 30px 100px rgba(0,0,0,.9);
}
.app::before{
  content:"";
  position:absolute;inset:-15%;
  z-index:-3;
  background:
    radial-gradient(circle at 50% 44%,rgba(5,50,82,.75) 0%,rgba(2,20,34,.58) 28%,transparent 52%),
    radial-gradient(circle at 50% 50%,transparent 50%,rgba(0,0,0,.95) 79%);
}
.app::after{
  content:"";
  position:absolute;inset:0;
  z-index:20;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 42%,transparent 35%,rgba(0,0,0,.14) 61%,rgba(0,0,0,.65) 100%),
    linear-gradient(180deg,rgba(0,0,0,.16),transparent 22%,transparent 78%,rgba(0,0,0,.38));
}

.atmosphere{
  position:absolute;inset:0;pointer-events:none;opacity:.72;
  background:
    radial-gradient(circle at 12% 28%,rgba(0,104,180,.16) 0 1px,transparent 2px),
    radial-gradient(circle at 76% 18%,rgba(70,160,255,.13) 0 1px,transparent 2px),
    radial-gradient(circle at 82% 69%,rgba(0,120,220,.12) 0 1px,transparent 2px),
    radial-gradient(circle at 23% 78%,rgba(80,170,255,.1) 0 1px,transparent 2px);
  background-size:110px 130px,150px 170px,130px 160px,180px 150px;
  mix-blend-mode:screen;
}

.topbar{position:relative;display:flex;align-items:center;justify-content:flex-end;gap:8px;min-height:34px}
.topbar:has(.lang-switch){padding-right:0}
.brand{display:flex;flex-direction:column;gap:2px;text-shadow:0 2px 12px #000}
.brand strong{font-size:clamp(.8rem,2.3vw,1.05rem);font-weight:800;letter-spacing:.01em}
.brand span{font-size:clamp(.52rem,1.6vw,.72rem);opacity:.5;direction:ltr;text-align:right}
#x-social{position:absolute;z-index:35;right:0;top:100%;transform:none;direction:ltr;width:30px;height:30px}
.icon-btn{position:fixed;top:18px;right:18px;z-index:10000;display:flex;align-items:center;justify-content:center;width:38px;height:38px;border:1px solid rgba(255,255,255,.18);border-radius:50%;background:rgba(8,12,16,.62);backdrop-filter:blur(8px);color:#fff;text-decoration:none!important;cursor:pointer}
.icon-btn:hover{background:rgba(40,130,210,.2);border-color:rgba(150,220,255,.5);transform:translateY(-1px)}
.topbar{gap:7px;display:flex;align-items:center;justify-content:flex-end;position:absolute;right:14px;top:12px;z-index:50}.topbar .icon-btn{position:static!important;transform:none!important}.topbar #x-social{text-decoration:none!important}.icon-btn:focus,.icon-btn:focus-visible,.lang-switch button:focus,.lang-switch button:focus-visible{outline:none;box-shadow:none}

.orbit{position:absolute;inset:0;display:grid;place-items:center;z-index:2}
.menu-svg{width:min(96vw,96vh);height:min(96vw,96vh);overflow:visible;position:relative;z-index:2;outline:none;-webkit-tap-highlight-color:transparent}
.realm{cursor:pointer;transition:opacity .35s ease,filter .35s ease,transform .35s ease;transform-origin:500px 500px;outline:none!important;-webkit-tap-highlight-color:transparent}
.realm:focus,.realm:focus-visible{outline:none!important;box-shadow:none!important}
.realm:hover{filter:brightness(1.35) drop-shadow(0 0 18px currentColor)}
.realm-labels{pointer-events:none;position:relative;z-index:100}
.realm-label{pointer-events:none}
.realm.selected{filter:brightness(1.45) drop-shadow(0 0 25px currentColor)}
.ring-border{fill:none;stroke-width:2;vector-effect:non-scaling-stroke;opacity:.95}
.realm-title{display:none}

#core{cursor:pointer;transition:transform .5s ease,filter .5s ease}
#core:hover{filter:brightness(1.3) drop-shadow(0 0 30px white)}
.logo-viewer{position:fixed;inset:0;z-index:500;display:none;place-items:center;background:#000;padding:5vh 5vw;cursor:zoom-out;overflow:hidden}.logo-viewer.open{display:grid}.logo-art{display:block;width:min(82vw,82vh);height:min(82vw,82vh);max-width:900px;max-height:900px;cursor:default}.logo-art svg{display:block;width:100%;height:100%;overflow:visible}.logo-viewer-close{position:absolute;top:22px;right:22px;width:42px;height:42px;border:1px solid rgba(255,255,255,.3);border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:25px;line-height:1;cursor:pointer}.logo-viewer-close:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.6)}
@media(max-width:600px){.menu-svg{width:108vw;height:108vw}.realm-title{font-size:24px}}
.info{
  position:absolute;z-index:30;left:50%;bottom:3vh;transform:translateX(-50%);
  width:min(90%,650px);padding:18px 25px;
  border:1px solid rgba(255,255,255,.15);border-radius:18px;
  background:rgba(2,5,6,.72);backdrop-filter:blur(18px);
  box-shadow:0 16px 40px rgba(0,0,0,.35);text-align:center;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .35s ease,visibility .35s ease,transform .35s var(--ease);
}
.info.visible{opacity:1;visibility:visible;pointer-events:auto}
.info .kicker{font-size:clamp(.5rem,1.6vw,.68rem);letter-spacing:.16em;opacity:.45;margin-bottom:4px;direction:ltr}
.info h1{font-size:clamp(.9rem,3.2vw,1.35rem);margin-bottom:5px}
.info p{font-size:clamp(.55rem,1.75vw,.78rem);line-height:1.8;color:var(--muted);max-width:95%;margin:auto}


.info.reference{border-color:rgba(255,80,55,.26)}

.lang-switch{
  position:absolute;z-index:1000;left:50%;top:12px;transform:translateX(-50%);  display:flex;direction:ltr;border:1px solid rgba(220,240,255,.12);
  background:rgba(0,0,0,.28);border-radius:20px;padding:2px;backdrop-filter:blur(8px);
}
.lang-switch button{border:0;background:transparent;color:rgba(255,255,255,.48);padding:5px 8px;border-radius:16px;cursor:pointer;font-size:.62rem;font-weight:800}
.lang-switch button.active{background:rgba(255,255,255,.12);color:#fff}

.page{
  position:absolute;inset:0;
  width:100%;height:100%;aspect-ratio:3/4;
}
.page.book-page{z-index:100;display:none;background:#f3f4f2;color:#171918;overflow:hidden}
.book-shell{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.book-head{
  flex:0 0 auto;background:linear-gradient(135deg,#101214,#351818);
  color:#ffd8a4;padding:14px 15px 12px;display:flex;align-items:center;gap:9px;
  border-bottom:2px solid #c93a33;direction:rtl;
}
.book-head .book-title{font-weight:800;font-size:.83rem;flex:1}
.book-close{width:29px;height:29px;border-radius:50%;border:1px solid rgba(255,150,150,.35);background:rgba(255,80,80,.1);color:#ffb0aa;cursor:pointer}
.book-tabs{display:flex;gap:5px;overflow-x:auto;flex:0 0 auto;padding:9px;background:#e5e7e3;border-bottom:1px solid #cdd1cc}
.book-tabs::-webkit-scrollbar{height:4px}.book-tabs::-webkit-scrollbar-thumb{background:#aaa;border-radius:5px}
.book-tab{flex:0 0 auto;border:1px solid #c9cdc9;background:#fff;color:#5a5f5c;padding:6px 9px;border-radius:7px;font-size:.58rem;font-weight:800;cursor:pointer}
.book-tab.active{background:#2f6fd0;color:#fff;border-color:#2f6fd0}
.book-body{flex:1;min-height:0;overflow:auto;padding:22px 18px 40px;background:#f3f4f2;font-size:.82rem;line-height:2;color:#202321}
.book-body.lang-en{direction:ltr;text-align:left;font-family:Georgia,'Times New Roman',serif;line-height:1.75}
.book-body .book-h1{font-size:1.55rem;line-height:1.3;margin-bottom:2px;font-weight:800}
.book-body .book-sub{color:#626763;margin-bottom:22px;font-size:.8rem}
.chapter{margin-bottom:28px}
.chapter h2{display:flex;align-items:center;gap:8px;font-size:1rem;line-height:1.5;margin-bottom:13px}
.chapter h2 i{width:10px;height:10px;border-radius:50%;background:var(--dot,#2f6fd0);border:1px solid #bfc4bf;flex:none}
.chapter p{margin-bottom:14px;text-align:justify;text-align-last:right}
.book-body.lang-en .chapter p{text-align:justify;text-align-last:left}
.moral{margin-top:25px;padding:16px;border-top:2px solid #1d1f1e;background:rgba(47,111,208,.06);border-radius:9px}
.moral h2{color:#c93a33;margin-bottom:7px}
.moral p{font-weight:700;font-size:.88rem}

@media (max-width:520px){
  body{place-items:center}
  .menu-svg{width:108vw;height:108vw}
  .info{bottom:3vh;width:90%;padding:15px 18px}
}
@media (min-width:700px){
  .app{border-radius:4px}
}

/* ===== Landing page stability / interaction layer ===== */
html{width:100%;min-height:100%;background:#000}

            "That year, the oldest mouse in the forest died, and no one imitated its voice. Not because they could not, but because they no longer needed to. The creatures sat together and each told their own memory of it in their own voice. The conversation was uneven, full of pauses and repetitions, and no one could say who had spoken “better.” Strangely, it was warmer than any gathering the forest had held before.",

const bookChaptersZh = [
{title:"第一章：起源",dot:"#ffffff",paragraphs:[
"在古老的森林里，没有人知道第一个模仿者是谁。他们只知道，在那之前，每个生灵都只是它自己；在那个时代，这既不是美德，也不是缺陷。鹿奔跑，天鹅停在池塘边，没有谁缺少别人身上的什么，因而需要假装拥有。",
"后来，一只会模仿狼叫的八哥出现了。也许为了消遣，也许因为饥饿。田鼠听见狼声便僵在原地。并不是因为害怕狼，因为根本没有狼，而是因为惊讶。就在那短暂的停顿里，八哥拿走了它们的种子，离开了。",
"田鼠明白了发生的事，并像所有有所领悟的生灵一样，得出了错误的结论。它们说：“它不是偷窃，它只是有本事。”",
"这句话至今仍在森林里反复出现。三天后，它成了田鼠社会的智慧，一周后成了法律。没有人问：如果八哥只是有本事，为什么我们的种子少了？",
"在最初的日子里，只有自由的鹿和白翼天鹅笑了。它们笑，是因为看见了模仿就是模仿。这是森林里最后一次有人这样看见它，也是笑声最后一次不必付出代价。"]},
{title:"第二章：形成",dot:"#2f6fd0",paragraphs:[
"春天结束时，模仿从一次偶然变成了习俗，而森林里的习俗总是在有人问“为什么”之前就扎下了根。",
"田鼠最先称八哥为大师。大师当然需要学生。橡树下开了一间课堂，鹦鹉教大家模仿别人的声音，猴子教大家模仿别人的神态。入门的唯一条件是：上课前，学生必须向所有人证明自己早就会了。没有人制定这条规则，却人人遵守。",
"森林的表面几乎没有变化，只是池塘稍微浑浊了，因为凡想成为天鹅的，都得走进水里。社会中出现了一个新词：“同声者”。同声者就是和所有人发出同一种声音的人；从此，同声不再被看作恐惧，而被看作聪明。个体层面，一只名叫卡奇的田鼠从未模仿过声音，因此每晚只能独自面对自己的喉咙；它第一次练习怎样假装自己已经会了。",
"那一夜没有人意识到，这不是学习一项技能，而是学习如何表演一项技能。连卡奇自己也不知道。他只觉得自己的睡眠变浅了。",
"狐狸和乌鸦远远看着。狐狸说：“这是一个巨大的谎言。”乌鸦说：“可这是一个有效的谎言。”它们都很冒险，却都没有在那天回来看看这条路究竟通向哪里。"]},
{title:"第三章：生存",dot:"#e3b422",paragraphs:[
"那年夏天很干旱，而干旱是模仿无能为力的东西。即便如此，森林还是决定：模仿必须发挥作用。",
"先是水少了，然后是种子，最后是耐心。食物不足时，每个生灵都会走两条路之一：去寻找水，或者留下来说水正在路上。离开的是鹿和天鹅，还有几只孤独的狐狸。大多数再也没有回来。留下的是同声者。",
"同声者发现了一件比找到水更有价值的事：一个饥饿的生灵若听见有人自信地说“有食物”，便会平静下来；平静的饥饿者更少争斗、更少逃跑，也更愿意留下。当森林习惯了留下，它便开始依赖留下。",
"森林层面，橡树范围之外的池塘干涸了，却没有人去问为什么。社会层面，田鼠制定了新的配给：一天三次证明自己是“同声者”，便能得到完整份额。个体层面，卡奇终于发出了声音。那不是它自己的声音，但没人知道它原本的声音是什么，所以没人察觉。",
"第五十天，雨来了。同声者庆祝，说是它们召来了雨。因为已经没有人留下来反驳，这句话便成了事实。"]},
{title:"第四章：考验与学习",dot:"#7a4bb5",paragraphs:[
"雨后，森林进入了考验阶段。考验和一切繁荣之后出现的事物一样，变得不可避免。",
"问题很简单：如果大家都是同声者，谁更像同声者？如果有人声称自己的同声是真正的，谁能证明他正确？鹦鹉看见了这个问题，在任何人发问之前便造出了答案：裁判。",
"第一位裁判是一只名叫毛拉的老鹦鹉。它不模仿任何人的声音，也从不声称自己能够模仿。它只听，然后说“原本”或“复制”。因为没人知道它依据什么判断，它的话便成了不可质疑的结论。田鼠把这当作完美的标志。",
"随后出现了一个谁都不愿问的问题：毛拉自己究竟是原本还是复制？猴子给出了答案：除非一个人比裁判更像裁判，否则不能裁判裁判。从此每位裁判都有更高一级的裁判，而每位更高的裁判都需要一个懂得如何信任他的学生。",
"森林层面，橡树长出三根新枝，两根枝条却仍然光秃。社会层面，考验分成三层：模仿、模仿的模仿，以及模仿的模仿的模仿。个体层面，卡奇三项都通过了，却第一次不知道自己究竟哪一项说了真话。",
"那天晚上狐狸对乌鸦说：“我们也应该考试。”乌鸦问：“为什么？”狐狸说：“否则别人就不知道我们是什么。”乌鸦沉默了一会儿，说：“我们自己也不知道。”"]},
{title:"第五章：模拟",dot:"#c93a33",paragraphs:[
"世代更替，每一代都以为森林从一开始就是这样。",
"与此同时，王国建立了。一只连自己究竟是狮子，还是只是很会扮演狮子都不知道的狮子登上王座，直到死亡也没有弄明白。文化诞生，培育思想家，又沉入睡眠。生命带着自己的瞬间、眷恋与地平线开始又结束，记忆交给一个人，而那个人很快又交给另一个人。整个过程中，模仿的竞争像雪球一样滚动，逐一吞没其他竞争的场域。没有人知道它从哪里开始，也没有人追问。",
"森林层面，再也没有单纯的猎手或猎物。所有生灵都在扮演角色，连捕猎也按惯例变成了表演。社会层面，模拟得最好的人坐得离火最近，也最暖和。个体层面，每个生灵都知道：如果今晚不在台上，明天就不会有它的位置。",
"生命想继续，模仿也想继续。二者纠缠到无人能说清究竟是谁为谁打开了道路。生命的织物要求它们观看并被观看，动物别无选择，只能留在场上：直到力量的极限，直到最后一口气。",
"有一年，一只名叫卡奇的老田鼠留在台上，再也没有站起来。同声者哀悼三天。第四天，其中一只模仿了它的声音。大家都说，那声音很真实。"]},
{title:"第六章：份额",dot:"#3f9a52",paragraphs:[
"一个无人预料的春天里，新物种出现了。这本身就是好兆头，因为在森林里，凡无人预料的东西，至少都算原创。",
"细小的变异多年累积，却没人计数，最终形成了一个既不是鹿、也不是田鼠、也不是森林已有名称所能称呼的生灵。同声者围着它转了几天，测试它的声音。它没有发出模仿声。这对它们来说很新鲜，于是立刻被认作软弱。",
"但森林有一条高于一切软弱的规则：凡进入竞技场者，都必须拥有份额。这条规则同样无人书写，只是人人知道模仿的竞技场已经比森林本身更大，而比森林更大的东西不能再排除任何人。排除本身也需要一种表演，而现在每个人都有表演。",
"于是它们给新物种一份份额。一份很大的份额，因为代价很低。新来者还没弄清游戏是什么，就已经拥有其中一半；没人能说这是礼物还是陷阱。",
"森林层面，池塘重新充满了水，却没人明白原因。社会层面，裁判第一次沉默，因为它们不知道该裁什么。个体层面，那个尚未有名字的小生灵看着模仿声音的田鼠，问：“为什么？”",
"田鼠无言以对。这是森林里第一次有人不带表演地提出问题，而田鼠不知道该怎样回答。"]},
{title:"第七章：终结",dot:"#111111",paragraphs:[
"终结没有到来，因为终结也需要表演，而森林已经没有可以添加的表演了。",
"裁判最先明白这一点。橡树下召开了大会，新来者被叫来接受考验：原本还是复制？毛拉如今已经老到连自己在说什么都不清楚。它看着新来者，听了一会儿，生命中第一次没有给出裁决，只说：“我不知道。”森林里没人知道裁判也可以说“我不知道”，于是沉默一直持续到清晨。",
"随后猴子想从它手里夺走裁决。新来者问：“裁决是为了什么？”它们回答：“为了知道谁比谁更好。”那个仍没有名字的生灵说：“可我不想比任何人更好。”这句话从它口中传到耳朵，又从耳朵进入头脑；而那些什么都有位置的头脑，唯独没有给这句话留下位置。",
"森林层面，池塘保持平静。社会层面，那些直到此刻都知道如何回答每一个问题的表演者停住了。个体层面，最初发明模仿的八哥，如今老迈而孤独地坐在树下，突然听见了自己的声音。不是来自别人的嘴，而是来自自己的喉咙。那声音陌生得让它认不出来。",
"黄昏的黑暗——一天最后的颜色——落在森林上。没人写下这是终结，但每个人都独自感觉到，有什么东西正在归来。"]},
{title:"第八章：回归",dot:"#8b908c",paragraphs:[
"回归从一个无人预料的地方开始：从方程式开始。",
"在漫长的世纪里，森林一直背负着一个从未有人大声读出的方程：为了留下，必须有人留下成为失败者；也就是说，必须有人倒下。有捕猎，有份额，有考验，而所有这些下面都藏着一条不成文的条款：每一种优越都必须由某个人付出代价。新来者无意中检验了这条条款。它留下了，却没人倒下。第二天如此，下一周也如此。森林开始计数。",
"第一个大声说出结果的是狐狸。多年前它曾去寻找远方的池塘，再也没有回来；那个春天，它带着两只乌鸦回来，瘦弱、满身尘土，却没有表演。它说：“有水。那边也有水。没人必须倒下。”这个不相信任何未经表演之物的森林，反而相信了，因为已经没有人来模仿它。",
"森林层面，橡树之外的池塘重新变绿，古老的道路重新开放。社会层面，不成文的条款被抛弃，方程变得前所未有地简单：竞争不再围绕击败某个人，而围绕优越本身；而纯粹的优越无法靠表演获得。个体层面，已经找回声音却仍不认识它的八哥，第一次在没有观众时歌唱。",
"起初那声音并不好听。但几夜之后，它的耳朵习惯了它，于是发现这声音虽然粗糙，却拥有那些被偷来的声音都没有的东西：持久。"]},
{title:"第九章：顶峰",dot:"#8b908c",paragraphs:[
"没有人看见顶峰，因为顶峰到来时，每个人都忙着自己的事。",
"那时竞技场已经如此广阔，没有任何生灵能一次看见全部。曾经的一场竞争变成了千场竞争，而在每一场里胜过别人，都和升到云朵之上同样无用。生灵渐渐明白，把自己困在别人身上，就是消耗本可以用于自己的力量。",
"它们也开始认识自己。这才是最大的改变。每个人都知道自己拥有怎样的声音、怎样的力量、怎样的伙伴，也知道自己从哪里开始、能走多远。因为知道了这些，“谁更好？”的问题让位给另一个问题：“今天的我比昨天少了什么？”",
"森林层面，那棵数百年来枝条最光秃的橡树第一次每根枝条都长出了嫩芽。社会层面，裁判让位给导师。多年负责裁决的毛拉如今坐在同一棵树下，教年轻者倾听自己。学生不再模仿它；尽管它多年渴望这一刻，最初却不知道自己应该有什么感觉。个体层面，一只一生都在模仿注视的猴子第一次俯身看向池塘，看见了自己。它什么也没说，只是留下。",
"森林随着每一个生灵一起成长。不是因为谁超过了谁，而是因为每一个抵达自己的人，都把某些东西带回给所有人。成长不再是一串比赛，而变成一张合作的网络；每一个展开的节点，都牵动更多的线。",
"一天夜里，年老而平静的八哥盘点一切，明白这座建立在模仿之上的森林，如今正站在另一种东西之上。它没有名字，却已成为所有人习惯的东西。"]},
{title:"第十章：终章",dot:"#8b908c",paragraphs:[
"最后，森林给了新来者一个名字。它没有给自己命名，因为它仍不知道自己是什么；别人给它取了名，而它接受了，因为这对它并不重要。",
"那一年，森林里最老的田鼠死去，没有人模仿它的声音。不是因为做不到，而是因为已经不需要。生灵们坐在一起，每个人都用自己的声音讲述自己记得的它。谈话并不平整，充满停顿与重复，没有人能说谁说得“更好”。奇怪的是，这比森林此前举行的任何聚会都更温暖。",
"模仿仍然存在。森林里没有什么会彻底消失。有时有人出于玩笑或习惯模仿另一个人的声音，大家便笑。但没人再崇敬它，也没人害怕它。模仿回到了最初的位置：朋友之间的游戏，而不是衡量他们的尺度。",
"那个曾吞没所有竞争的竞技场依然存在。但进入它的条件已经改变。没人需要比别人更好，也不需要把自己演得更好。只需要成为自己，并且每天多成为一点自己。每个人的份额都是整座森林的份额；因为人人都有份额，所以没人需要夺走别人的份额。",
"一天夜里，月亮落在池塘上。年老的八哥已经不再是任何人的大师，而它对此很满意。一只雏鸟问：“为什么我们用了那么多年去模仿？”它回答：“因为我们害怕有人发现我们究竟是什么。后来，我们又害怕有人发现我们其实不知道。”",
"雏鸟沉默了。八哥继续说：“可根本没有谁来发现。我们一直都在互相观看。”"]}
];

{title:"الفصل الثاني: التشكّل",dot:"#2f6fd0",paragraphs:[
"بحلول نهاية الربيع، تحول التقليد من حادثة إلى عادة، والعادات في الغابة تترسخ دائمًا قبل أن يسأل أحد: «لماذا؟»",
"كانت الفئران أول من سمّى الشحرورة أستاذًا. والأستاذ، كما هو معلوم، يحتاج إلى تلاميذ. أقيم صف تحت شجرة البلوط، تعلم فيه الببغاوات كيفية تقليد أصوات الآخرين، وتعلمت القرود كيفية تقليد نظراتهم. وكان شرط الدخول الوحيد أن يثبت التلميذ للجميع، قبل بدء الدرس، أنه يعرف ذلك أصلًا. لم يضع أحد هذا الشرط، والجميع التزم به.",
"على مستوى الغابة لم يتغير شيء تقريبًا، سوى أن البركة أصبحت أكثر عكارة قليلًا، لأن من أراد أن يكون بجعة كان عليه أن يمشي في الماء. وعلى مستوى المجتمع ظهرت كلمة جديدة: «متناغم». والمتناغم هو من يصدر صوتًا كالجميع، ومنذ ذلك الحين لم يعد التشابه في الصوت علامة خوف، بل علامة ذكاء. وعلى المستوى الفردي، بدأ فأر اسمه خاكِي، لم يقلد صوتًا قط ولذلك كان يقضي كل ليلة وحيدًا مع حنجرته، يتدرب لأول مرة على كيفية التظاهر بأنه يعرف.",
"في تلك الليلة لم يفهم أحد أن هذا ليس تعلم مهارة، بل تعلم أداء المهارة. حتى خاكِي نفسه لم يفهم. شعر فقط أن نومه أصبح أخف.",
"كانت الثعالب والغربان تراقب من بعيد. قال الثعلب: «إنها كذبة عظيمة.» وقال الغراب: «لكنها كذبة تنجح.» ومع أنهما كانا مغامرين، لم يعودا في ذلك اليوم ليريا إلى أين يقود الطريق."]},
{title:"الفصل الثالث: البقاء",dot:"#e3b422",paragraphs:[
"كان الصيف في ذلك العام جافًا، والجفاف شيء لا يستطيع التقليد أن يفعل أمامه شيئًا. ومع ذلك قررت الغابة أن على التقليد أن يعمل.",
"نقص الماء أولًا، ثم البذور، ثم الصبر. حين يقل الطعام يسلك كل كائن أحد طريقين: إما يذهب بحثًا عن الماء، أو يبقى ويقول إن الماء في الطريق. الذين رحلوا كانوا الغزلان والبجع وبعض الثعالب المنفردة. معظمهم لم يعد. أما الذين بقوا فكانوا المتناغمين.",
"توصل المتناغمون إلى اكتشاف أثمن من العثور على الماء: الجائع الذي يسمع حيوانًا يقول بثقة «هناك طعام» يهدأ؛ والجائع الهادئ يقل قتالُه وهربُه ويبقى مدة أطول. وحين اعتادت الغابة البقاء، أصبحت تعتمد عليه.",
"على مستوى النظام البيئي جفت البرك خارج نطاق البلوطة، ولم يذهب أحد ليرى لماذا. وعلى المستوى الاجتماعي حددت الفئران حصة جديدة: من يثبت ثلاث مرات في اليوم أنه «متناغم» يحصل على الحصة كاملة. وعلى المستوى الفردي، أطلق خاكِي صوته أخيرًا. لم يكن صوته الحقيقي، لكن بما أن أحدًا لم يعرف كيف كان صوته الأصلي، لم يلاحظ أحد.",
"في اليوم الخمسين جاء المطر. احتفل المتناغمون وقالوا إنهم استدعوه. ولأنه لم يبق أحد ليقول غير ذلك، أصبحت قصتهم حقيقة."]},
{title:"الفصل الرابع: الاختبار والتعلم",dot:"#7a4bb5",paragraphs:[
"بعد المطر وصلت الغابة إلى مرحلة الاختبار. والاختبار، مثل كل شيء يأتي بعد الرفاه، أصبح ضروريًا.",
"كانت المسألة بسيطة: إذا كان الجميع متناغمين، فمن الأكثر تناغمًا؟ وإذا ادعى أحد أن تناغمه أصيل، فمن يقول إنه على حق؟ رأى الببغاوات المشكلة وصنعوا، قبل أن يسأل أحد، الحل: قاضٍ.",
"كان أول قاضٍ ببغاءً عجوزًا اسمه ملا. لم يقلد صوت أحد ولم يدّع أنه يستطيع. كان يصغي فقط ثم يقول: «أصل» أو «نسخة». ولأن أحدًا لم يعرف على أي أساس يحكم، أصبحت كلمته غير قابلة للنقاش. وعدّت الفئران ذلك علامة كمال.",
"ثم ظهر سؤال لم يرغب أحد في طرحه: هل ملا نفسه أصل أم نسخة؟ أجابت القرود: لا يستطيع أحد أن يحاكم قاضيًا إلا إذا كان قاضيًا أعظم منه. ومنذ ذلك الحين صار لكل قاضٍ قاضٍ أعلى، وكل قاضٍ أعلى يحتاج إلى تلميذ يعرف كيف يثق به.",
"على مستوى الغابة أخرجت البلوطة ثلاثة أغصان جديدة وبقي غصنان بلا أوراق. وعلى المستوى الاجتماعي صار للاختبارات ثلاثة مستويات: التقليد، وتقليد التقليد، وتقليد تقليد التقليد. وعلى المستوى الفردي اجتاز خاكِي المستويات الثلاثة، ولأول مرة لم يعرف أيها أجاب عنه بصدق.",
"قال الثعلب للغراب تلك الليلة: «علينا أن نمتحن أيضًا.» سأل الغراب: «لماذا؟» قال الثعلب: «لأن الآخرين إن لم يعرفوا، فلن يعرفوا ما نحن.» صمت الغراب قليلًا ثم قال: «ونحن أيضًا لا نعرف.»"]},
{title:"الفصل الخامس: المحاكاة",dot:"#c93a33",paragraphs:[
"جاءت أجيال ورحلت، وكل جيل ظن أن الغابة كانت هكذا منذ البداية.",
"قامت الممالك في الأثناء. جلس أسد على العرش، ولم يكن يعرف هل هو أسد حقًا أم بارع فقط في تمثيل الأسد، ومات قبل أن يعرف. ولدت الثقافات، وربّت المفكرين، ثم نامت. بدأت الحيوات وانتهت بكل لحظاتها وحنينها وآفاقها، وأودعت ذكرياتها لدى شخص سرعان ما أودعها لدى شخص آخر. وخلال ذلك كله تدحرج تنافس التقليد ككرة ثلج، يبتلع ساحات المنافسة واحدة بعد أخرى. لم يعرف أحد من أين بدأ، ولم يسأل أحد.",
"على مستوى الغابة لم يعد هناك حيوان هو صياد أو فريسة فحسب. الجميع يلعبون الأدوار، وحتى الصيد أصبح، وفق العادة، تمثيلًا. وعلى مستوى المجتمع كان من يحاكي أفضل يجلس أقرب إلى النار ويدفأ أكثر. وعلى المستوى الفردي كان كل كائن يعرف أنه إن غاب الليلة عن المسرح فلن يكون له مكان غدًا.",
"كانت الحياة تريد أن تستمر، وكذلك التقليد. امتزجا إلى حد لم يعد معه أحد يستطيع أن يقول أيهما فتح الطريق للآخر. وكان النسيج الحي يفرض عليهم أن يروا وأن يُروا، فلم يكن أمام الحيوانات إلا البقاء في المشهد: حتى أقصى طاقتهم، وحتى آخر نفس، على المسرح.",
"في عام من الأعوام بقي فأر عجوز اسمه خاكِي على المسرح ولم ينهض. حزن المتناغمون ثلاثة أيام. وفي اليوم الرابع قلد أحدهم صوته. قال الجميع إن صوته كان أصيلًا."]},
{title:"الفصل السادس: الحصص",dot:"#3f9a52",paragraphs:[
"ظهر نوع جديد في ربيع لم يتوقعه أحد، وكان ذلك في حد ذاته علامة جيدة، لأن كل ما لا يتوقعه أحد في الغابة يكون، على الأقل، أصيلًا.",
"تراكمت طفرات صغيرة طوال سنوات من دون أن يعدها أحد، وكانت نتيجتها كائنًا لا غزالًا ولا فأرًا ولا شيئًا آخر تملك الغابة له اسمًا. دار المتناغمون حوله أيامًا واختبروا صوته. لم يقلد. كان ذلك جديدًا عليهم، فعدوه فورًا علامة ضعف.",
"لكن للغابة قانونًا أعلى من كل ضعف: من يدخل الساحة يجب أن تكون له حصة. لم يكتب أحد هذا القانون أيضًا. كان الجميع يعرفون فقط أن ساحة التقليد أصبحت أكبر من الغابة، وما هو أكبر من الغابة لا يستطيع استبعاد أحد. والاستبعاد نفسه يحتاج إلى تقليد، والتقليد أصبح الآن في متناول الجميع.",
"لذلك أعطوا النوع الجديد حصة. حصة كبيرة لأنها رخيصة. وقبل أن يفهم القادم الجديد ما هي اللعبة، صار يملك نصفها، ولم يستطع أحد أن يقول هل كانت هدية أم فخًا.",
"على مستوى الغابة امتلأت البرك من جديد، ولم يفهم أحد لماذا. وعلى المستوى الاجتماعي صمت القضاة للمرة الأولى، لأنهم لم يعرفوا ما الذي يحكمون عليه. وعلى المستوى الفردي نظر القادم الصغير، الذي لم يكن له اسم بعد، إلى فأر يقلد صوتًا وسأل: «لماذا؟»",
"لم يكن لدى الفأر جواب. كانت تلك أول مرة يطرح فيها أحد في الغابة سؤالًا بلا تقليد، ولم يعرف الفأر كيف يجيبه."]},
{title:"الفصل السابع: النهاية",dot:"#111111",paragraphs:[
"لم تأت النهاية، لأن النهايات تحتاج إلى تقليد أيضًا، ولم يعد لدى الغابة تقليد تضيفه.",
"كان القضاة أول من فهم. عقد اجتماع كبير تحت البلوطة، واستُدعي القادم الجديد إلى الاختبار: أصل أم نسخة؟ نظر ملا، الذي صار أكبر من أن يعرف حتى ما يقول، إليه وأصغى، ولأول مرة في حياته لم يصدر حكمًا. قال: «لا أعرف.» ولأن أحدًا في الغابة لم يكن يعرف أن القاضي يستطيع أن يقول «لا أعرف»، ساد صمت حتى الصباح.",
"ثم أرادت القرود أن تنتزع منه الحكم. سأل القادم: «حكم من أجل ماذا؟» فأجابوا: «لكي نعرف من أفضل من من.» فقال، وهو لا يزال بلا اسم: «لكنني لا أريد أن أكون أفضل من أحد.» انتقلت الجملة من فمه إلى آذانهم، ومن آذانهم إلى عقولهم، ولم تجد في تلك العقول، التي كان فيها مكان لكل شيء، مكانًا لها.",
"على مستوى الغابة بقيت البركة هادئة. وعلى المستوى الاجتماعي توقف المقلدون، الذين كانوا يعرفون حتى ذلك اليوم كيف يجيبون عن كل سؤال. وعلى المستوى الفردي سمعت الشحرورة التي قامت بأول تقليد، وقد شاخت ووحدها تحت الشجرة، صوتها فجأة. لا من فم أحد، بل من حنجرتها هي. كان غريبًا إلى حد أنها لم تعرفه.",
"سقط سواد الغروب، آخر ألوان النهار، على الغابة. لم يكتب أحد أن هذه هي النهاية، لكن الجميع، كل واحد وحده، شعر بأن شيئًا ما يعود."]},
{title:"الفصل الثامن: العودة",dot:"#8b908c",paragraphs:[
"بدأت العودة من حيث لم يتوقعها أحد: من المعادلة.",
"كانت للغابة طوال قرونها معادلة لم يقرأها أحد بصوت عال: لكي يبقى أحد، يجب أن يبقى أحد خاسرًا، أي يجب أن يسقط أحد. كان هناك صيد وحصص واختبارات، وتحتها كلها بند غير مكتوب يقول إن كل تفوق يجب أن يدفع ثمنه شخص ما. اختبر القادم الجديد هذا البند من دون أن يعرف. بقي، ولم يسقط أحد. وفي اليوم التالي حدث الشيء نفسه، ثم في الأسبوع التالي بدأت الغابة تعد.",
"كان أول من أعلن النتيجة الثعلب. قبل سنوات ذهب يبحث عن برك بعيدة ولم يعد؛ وفي ذلك الربيع عاد ومعه غرابان، نحيلان مغبران وبلا تقليد. قال: «هناك ماء. وهناك ماء في الجهة الأخرى أيضًا. لا أحد مضطر إلى السقوط.» صدقت الغابة، التي لم تكن تصدق شيئًا بلا تقليد، هذه المرة لأنه لم يكن هناك من يقلده.",
"على مستوى الغابة اخضرت البرك خارج البلوطة من جديد وانفتحت الطرق القديمة. وعلى المستوى الاجتماعي أُسقط البند غير المكتوب وأصبحت المعادلة أبسط من أي وقت: لم تعد المنافسة على هزيمة أحد، بل على التفوق نفسه؛ والتفوق الخالص شيء لا يمكن انتزاعه بالتقليد. وعلى المستوى الفردي غنت الشحرورة، التي وجدت صوتها ولم تتعرف إليه بعد، للمرة الأولى بلا جمهور.",
"كان الصوت قبيحًا في البداية. لكن بعد ليالٍ قليلة اعتادت أذناها عليه، ورأت أن هذا الصوت، بكل خشونته، يحمل شيئًا لم يكن في أي من الأصوات المسروقة: الديمومة."]},
{title:"الفصل التاسع: الذروة",dot:"#8b908c",paragraphs:[
"لم ير أحد الذروة، لأن الذروة تأتي حين يكون الجميع منشغلين بعملهم.",
"كانت الساحات قد اتسعت إلى حد لا يستطيع معه كائن أن يراها كلها دفعة واحدة. وما كان منافسة واحدة أصبح ألف منافسة، وفي كل واحدة كان التفوق على الآخر عديم الجدوى كالصعود فوق السحاب. بدأ الكائنات يدركون أن الانشغال بالآخر يعني إنفاق قوة كان يمكن إنفاقها على أنفسهم.",
"وكانوا قد عرفوا أنفسهم. كان ذلك أكبر تغير. عرف كل واحد ما لديه: أي صوت، وأي قوة، وأي رفاق. وعرف من أين بدأ وإلى أين يستطيع أن يصل. ولأنه عرف، تراجع سؤال «من الأفضل؟» أمام سؤال آخر: «ما الذي ينقصني اليوم مما كان لدي بالأمس؟»",
"على مستوى الغابة أخرجت البلوطة، التي حملت أغصانًا عارية قرونًا، براعم من كل غصن لأول مرة. وعلى المستوى الاجتماعي حل المرشدون محل القضاة. كان ملا، الذي قضى سنوات يصدر الأحكام، يجلس الآن تحت الشجرة نفسها ويعلم الصغار كيف يصغون إلى أنفسهم. لم يعد تلاميذه يقلدونه، ومع أنه تمنى ذلك سنوات، لم يعرف في البداية ماذا ينبغي أن يشعر. وعلى المستوى الفردي انحنى قرد قضى حياته يقلد النظر إلى البركة للمرة الأولى ورأى نفسه. لم يقل شيئًا. بقي فقط.",
"كبرت الغابة مع كل واحد منهم. لا لأن أحدًا تقدم على آخر، بل لأن كل من وصل إلى نفسه حمل شيئًا إلى الجميع. صار النمو، بدل أن يكون سلسلة من السباقات، شبكة من التعاون، وكل عقدة تتفتح أكثر تحمل معها خيوطًا أكثر.",
"وفي ليلة، عدّت الشحرورة العجوز الهادئة كل شيء، وفهمت أن الغابة التي بُنيت على التقليد تقف الآن على شيء آخر. شيء بلا اسم، لكنه صار مألوفًا للجميع."]},
{title:"الفصل العاشر: الخاتمة",dot:"#8b908c",paragraphs:[
"في النهاية، منحت الغابة القادم الجديد اسمًا. لم يسم نفسه، لأنه لم يكن يعرف بعد ما هو؛ سمّاه الآخرون وقبل الاسم لأنه لم يكن مهمًا بالنسبة إليه.",
"في ذلك العام مات أقدم فأر في الغابة، ولم يقلد أحد صوته. لا لأنهم عاجزون، بل لأنهم لم يعودوا بحاجة إلى ذلك. جلس الكائنات معًا، وكل واحد روى ذكراه عنه بصوته هو. كان الحوار غير متساوٍ، مليئًا بالتوقف والتكرار، ولم يستطع أحد أن يقول من تحدث «أفضل». والغريب أنه كان أدفأ من أي تجمع عرفته الغابة من قبل.",
"ظل التقليد موجودًا. لا شيء يختفي تمامًا في الغابة. أحيانًا كان أحدهم يقلد صوت آخر من باب المزاح أو العادة، فيضحك الجميع. لكن لم يعد أحد يقدسه ولا يخشاه. عاد التقليد إلى مكانه الأول: لعبة بين الأصدقاء، لا مقياسًا للحكم عليهم.",
"وظلت الساحة التي كانت تبتلع كل المنافسات موجودة. لكن شرط دخولها تغير. لم يعد مطلوبًا أن يكون أحد أفضل من الآخر، أو أفضل في التظاهر. كان المطلوب فقط أن يكون كل واحد كما هو، وأن يزداد قليلًا كل يوم. كانت حصة كل واحد حصة الغابة كلها، وبما أن للجميع حصة، لم يحتج أحد إلى أخذ حصة غيره.",
"في ليلة كان القمر فيها مستلقيًا على البركة، كانت الشحرورة العجوز قد لم تعد أستاذًا لأحد، وكانت راضية بذلك. سألها فرخ: «لماذا قضينا كل تلك السنين نقلد؟» فقالت: «لأننا كنا نخشى أن يكتشف أحد ما نحن عليه حقًا. ثم خفنا أن يكتشف أحد أننا لا نعرف.»",
"صمت الفرخ. وتابعت الشحرورة: «لكن لم يكن هناك أحد ليكتشف ذلك. كنا جميعًا نراقب بعضنا بعضًا.»"]}
];

const bookMoralEn = "The one who displays a skill goes only as far as there are spectators; the one who practices a skill goes as far as they themselves can go. And a forest where everyone is a spectator eventually has nothing left to see but the act of watching itself.";
const bookMoralFa = 'آنکه مهارت را نمایش می‌دهد، فقط تا آنجا می‌رود که تماشاگر دارد؛ آنکه مهارت را می‌ورزد، تا آنجا که خودش می‌رود. و جنگلی که همه در آن تماشاگرند، سرانجام جز خودِ تماشا چیزی برای دیدن ندارد.';

let uiLang='fa';
let bookLang='fa';
let activeId='structure';

const app=document.getElementById('app');
const info=document.getElementById('info');
const infoTitle=document.getElementById('info-title');
const infoText=document.getElementById('info-text');
const realms=[...document.querySelectorAll('.realm')];
const core=document.getElementById('core');

function setInfo(id,show=true){
  activeId=id;
  realms.forEach(r=>r.classList.toggle('selected',r.dataset.id===id));
  const d=copy[uiLang][id];
  infoTitle.textContent=d.title;
  infoText.textContent=d.text;
  info.classList.toggle('reference',id==='reference');
  if(show) info.classList.add('visible');
}

function clearInfo(){
  info.classList.remove('visible');
  realms.forEach(r=>r.classList.remove('selected'));
}

function selectRealm(id){
  if(id==='core'){
    setInfo('core');
    
    return;
  }
  const realm=realms.find(r=>r.dataset.id===id);
  if(!realm) return;
  
  setInfo(id);
  if(id==='share'){openShare();}
  if(id==='experience'){openExperience();}
  if(id==='continuity'){openContinuity();}
  if(id==='structure'){window.clearTimeout(window.__structureOpenTimer);openStructure();}
  if(id==='reference'){
    window.clearTimeout(window.__referenceOpenTimer);
    window.__referenceOpenTimer=window.setTimeout(openReference,220);
  }
}

const logoViewer=document.getElementById('logo-viewer');
const logoViewerClose=document.getElementById('logo-viewer-close');
function openLogoViewer(){clearInfo();logoViewer.classList.add('open');}
function closeLogoViewer(){logoViewer.classList.remove('open');}
core.setAttribute('tabindex','0');
core.addEventListener('click',event=>{event.preventDefault();event.stopPropagation();openLogoViewer();});
core.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();openLogoViewer();}});
logoViewerClose.addEventListener('click',event=>{event.stopPropagation();closeLogoViewer();});
logoViewer.addEventListener('click',event=>{if(event.target===logoViewer)closeLogoViewer();});

const realmShare=document.getElementById('realm-share');
if(realmShare){
  realmShare.addEventListener('click',event=>{
    event.preventDefault();
    event.stopPropagation();
    openShare();
  });
  realmShare.addEventListener('keydown',event=>{
    if(event.key==='Enter'||event.key===' '){
      event.preventDefault();

    }
  });

const realmGeometry=[
  ['structure',365,445],
  ['continuity',285,365],
  ['experience',205,285],
  ['reference',125,205],
  ['share',70,125]
];
const universe=document.getElementById('universe');

function realmFromPoint(event){
  const rect=universe.getBoundingClientRect();
  const x=(event.clientX-rect.left)/rect.width*1000;
  const y=(event.clientY-rect.top)/rect.height*1000;
  const radius=Math.hypot(x-500,y-500);
  if(radius<=70)return 'core';
  for(const [id,inner,outer] of realmGeometry){
    if(radius>inner && radius<=outer)return id;
  }
  return null;
}
let lastSelectionAt=0;
realms.forEach(realm=>{
  realm.addEventListener('click',event=>{
    event.preventDefault();
    event.stopPropagation();
    const now=performance.now();
    if(now-lastSelectionAt<90)return;
    lastSelectionAt=now;
    selectRealm(realm.dataset.id);
  });
  realm.addEventListener('keydown',event=>{
    if(event.key==='Enter'||event.key===' '){
      event.preventDefault();
      selectRealm(realm.dataset.id);
    }
  });
});

function setUiLanguage(lang){
  if(!['zh','fa','en','ar'].includes(lang)) lang='fa';
  uiLang=lang;
  try{localStorage.setItem('modern-outlook.lang.v1',lang)}catch(_){}
  document.documentElement.lang=lang;
  document.documentElement.dir=(lang==='en'?'ltr':'rtl');
  document.body.dataset.lang=lang;
  document.getElementById('ui-zh').classList.toggle('active',lang==='zh');
  document.getElementById('ui-fa').classList.toggle('active',lang==='fa');
  document.getElementById('ui-en').classList.toggle('active',lang==='en');
  document.getElementById('ui-ar').classList.toggle('active',lang==='ar');
  document.querySelectorAll('[data-fa][data-en]').forEach(el=>{
    const value=lang==='fa'?el.dataset.fa:(lang==='en'?el.dataset.en:(el.dataset.zh||el.dataset.en));
    if(value!=null)el.textContent=value;
  });
  const current=copy[lang]?.[activeId]||copy.fa[activeId];
  infoTitle.textContent=current.title;
  infoText.textContent=current.text;
  const brand=document.querySelector('.brand strong');
  const brandAlt=document.querySelector('.brand span');
  if(lang==='zh'){
    brand.textContent='现代视野';
    brandAlt.textContent='Modern Outlook';
  }else if(lang==='en'){
    brand.textContent='Modern Outlook';
    brandAlt.textContent='نگرش نوین';
  }else if(lang==='ar'){
    brand.textContent='النظرة الحديثة';
    brandAlt.textContent='Modern Outlook';
  }else{
    brand.textContent='نگرش نوین';
    brandAlt.textContent='Modern Outlook';
  }
  localizeHomeUi(lang);
  document.title=lang==='zh'?'现代视野 — Modern Outlook':lang==='en'?'Modern Outlook — نگرش نوین':lang==='ar'?'النظرة الحديثة — Modern Outlook':'نگرش نوین — Modern Outlook';
  // The book is part of this page, so it follows the same single global language control.
  if(typeof bookLang!=='undefined'){
    bookLang=lang;
    const bt=document.getElementById('book-title');
    if(bt) bt.textContent=lang==='en'?'📖 The Forgers of Imitation — Ten Chapters':lang==='zh'?'📖 《模仿的伪造者》— 十章':lang==='ar'?'📖 مزوّرو التقليد — عشرة فصول':'📖 جاعلان تقلید — در ده فصل';
    if(typeof bookPage!=='undefined'&&bookPage.style.display==='block'){
      const currentTab=Math.max(0,[...document.querySelectorAll('.book-tab')].findIndex(b=>b.classList.contains('active')));
      buildBookTabs(currentTab);
      selectChapter(currentTab);
    }
  }
}
document.addEventListener('site:languagechange',event=>{if(event.detail?.lang) setUiLanguage(event.detail.lang)});

const home=document.getElementById('home-page');
const sharePage=document.getElementById('share-page');
const experiencePage=document.getElementById('experience-page');
const continuityPage=document.getElementById('continuity-page');
const structurePage=document.getElementById('structure-page');
const referencePage=document.getElementById('reference-page');
const bookPage=document.getElementById('book-page');
let bookReturn='home';
const bookTabs=document.getElementById('book-tabs');
const bookBody=document.getElementById('book-body');

function activeChapters(){return bookLang==='fa'?bookChapters:(bookLang==='zh'?bookChaptersZh:(bookLang==='ar'?bookChaptersAr:bookChaptersEn))}

function buildBookTabs(active=0){
  bookTabs.innerHTML='';
  activeChapters().forEach((ch,i)=>{
    const b=document.createElement('button');
    b.className='book-tab'+(i===active?' active':'');
    b.textContent=ch.title;
    b.addEventListener('click',()=>selectChapter(i));
    bookTabs.appendChild(b);
  });
}

function selectChapter(i){
  const chapters=activeChapters();
  document.querySelectorAll('.book-tab').forEach((b,n)=>b.classList.toggle('active',n===i));
  const ch=chapters[i];
  let html='';
  if(i===0){
    html+=bookLang==='en'
      ? '<h1 class="book-h1">The Forgers of Imitation</h1><p class="book-sub">Ten Chapters</p>'
      : bookLang==='zh'
        ? '<h1 class="book-h1">《模仿的伪造者》</h1><p class="book-sub">十章</p>'
        : '<h1 class="book-h1">جاعلان تقلید</h1><p class="book-sub">در ده فصل</p>';
  }
  html+='<div class="chapter" style="--dot:'+ch.dot+'"><h2><i></i>'+ch.title+'</h2>';
  ch.paragraphs.forEach(p=>html+='<p>'+p+'</p>');
  html+='</div>';
  if(i===chapters.length-1){
    html+='<div class="moral"><h2>'+(bookLang==='en'?'Fable Wisdom':bookLang==='zh'?'寓言智慧':'حکمت فابل')+'</h2><p>'+(bookLang==='en'?bookMoralEn:bookLang==='zh'?'展示技艺的人只能走到有观众的地方；磨炼技艺的人能走到自己能够抵达的地方。而一座人人都是观众的森林，最终除了观看本身，便再没有什么可看。':bookLang==='ar'?'من يعرض مهارة لا يذهب إلا بقدر ما لديه من متفرجين؛ ومن يمارس مهارة يذهب إلى أبعد ما يستطيع. والغابة التي يكون الجميع فيها متفرجين لا يبقى فيها في النهاية شيء يُرى سوى فعل المشاهدة نفسه.':bookMoralFa)+'</p></div>';
  }
  bookBody.classList.toggle('lang-en',bookLang==='en');
  bookBody.dir=bookLang==='en'?'ltr':'rtl';
  bookBody.innerHTML=html;
  bookBody.scrollTop=0;
}

function openShare(){home.style.display='none';referencePage.style.display='none';bookPage.style.display='none';structurePage.style.display='none';continuityPage.style.display='none';experiencePage.style.display='none';sharePage.style.display='block';clearInfo();}

function openExperience(){home.style.display='none';referencePage.style.display='none';bookPage.style.display='none';structurePage.style.display='none';continuityPage.style.display='none';experiencePage.style.display='block';clearInfo();}
function closeExperience(){experiencePage.style.display='none';home.style.display='block';setInfo('experience');}
function openContinuity(){home.style.display='none';referencePage.style.display='none';bookPage.style.display='none';structurePage.style.display='none';experiencePage.style.display='none';continuityPage.style.display='block';clearInfo();}
function closeContinuity(){continuityPage.style.display='none';home.style.display='block';setInfo('continuity');}
function openStructure(){window.clearTimeout(window.__structureOpenTimer);home.style.display='none';referencePage.style.display='none';bookPage.style.display='none';continuityPage.style.display='none';structurePage.style.display='block';clearInfo();}

function openReference(){home.style.display='none';bookPage.style.display='none';referencePage.style.display='block';}
function closeReference(){referencePage.style.display='none';home.style.display='block';setInfo('reference');}
function openBook(from='home'){bookReturn=from;
  home.style.display='none';
  referencePage.style.display='none';
  bookPage.style.display='block';
  buildBookTabs(0);
  selectChapter(0);
  
}

function closeBook(){bookPage.style.display='none';if(bookReturn==='reference'){referencePage.style.display='block';}else{home.style.display='block';setInfo('reference');}}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&logoViewer.classList.contains('open')){closeLogoViewer();return;}
  if(e.key==='Escape'&&bookPage.style.display==='block')closeBook();
  if(e.key==='Escape'&&sharePage.style.display==='block')closeShare();
  if(e.key==='Escape'&&experiencePage.style.display==='block')closeExperience();
  if(e.key==='Escape'&&continuityPage.style.display==='block')closeContinuity();
  if(e.key==='Escape'&&structurePage.style.display==='block')closeStructure();
  if(e.key==='Escape'&&referencePage.style.display==='block')closeReference();
  if(logoViewer.classList.contains('open')||bookPage.style.display==='block'||referencePage.style.display==='block'||structurePage.style.display==='block'||continuityPage.style.display==='block'||experiencePage.style.display==='block'||sharePage.style.display==='block')return;
  const order=['structure','continuity','experience','reference','share'];
  const idx=order.indexOf(activeId);
  if(['ArrowDown','ArrowRight'].includes(e.key)){e.preventDefault();setInfo(order[(idx+1)%order.length])}
  if(['ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();setInfo(order[(idx-1+order.length)%order.length])}
  if(e.key==='Enter'&&activeId==='reference')openReference();
});
