<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="i18n-page" content="layer3">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; child-src 'none'; connect-src 'self' https:; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">

<title>پژواک لایه سوم — Modern Outlook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<main class="layer3-page" id="layer3-page">
  <div class="layer3-scene" aria-hidden="true">
    <div class="layer3-ring r1"></div><div class="layer3-ring r2"></div><div class="layer3-ring r3"></div><div class="layer3-ring r4"></div>
  </div>
  <div class="lang-switch" aria-label="زبان رابط">

    <button data-site-lang="ar" type="button">العربية</button>
  </div>
  <header class="layer3-head">
    <div class="layer3-title"><strong id="layer3-title"></strong><span id="layer3-subtitle"></span></div>
    <button class="layer3-close" id="layer3-close" type="button" aria-label="بستن">✕</button>
  </header>
  <nav class="layer3-tabs" id="layer3-tabs" aria-label="فهرست"></nav>
  <article class="layer3-body" id="layer3-body" aria-live="polite"></article>
</main>
<script src="translations/i18n.js"></script>
