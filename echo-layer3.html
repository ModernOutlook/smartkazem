<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="i18n-page" content="layer3">
<meta name="i18n-blocks" content="book">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; child-src 'none'; connect-src 'self'; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()">
<title>پژواک لایه سوم — Modern Outlook</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:#000}
body{display:grid;place-items:center;font-family:Vazirmatn,Tahoma,sans-serif;color:#202321}
.page{position:relative;width:min(100vw,75vh);height:min(133.333333vw,100vh);aspect-ratio:3/4;max-width:100vw;max-height:100vh;display:flex;flex-direction:column;min-height:0;overflow:hidden;background:#f3f4f2;box-shadow:0 0 0 1px rgba(130,190,240,.12),0 30px 100px rgba(0,0,0,.9)}
.global-lang{position:absolute;z-index:9999;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:2px;border:1px solid rgba(220,240,255,.16);background:rgba(0,0,0,.3);border-radius:20px;backdrop-filter:blur(8px);direction:ltr}
.global-lang button{border:0;background:transparent;color:rgba(255,255,255,.62);padding:5px 8px;border-radius:16px;cursor:pointer;font:800 .62rem/1 Vazirmatn,Tahoma,sans-serif}
.global-lang button.active{background:rgba(255,255,255,.14);color:#fff}
.book-head{flex:0 0 auto;background:linear-gradient(135deg,#101214,#351818);color:#ffd8a4;padding:14px 15px 12px;display:flex;align-items:center;gap:9px;border-bottom:2px solid #c93a33;direction:rtl}
.book-title{font-weight:800;font-size:.83rem;flex:1}.book-close{width:29px;height:29px;border-radius:50%;border:1px solid rgba(255,150,150,.35);background:rgba(255,80,80,.1);color:#ffb0aa;cursor:pointer}
.book-tabs{display:flex;gap:5px;overflow-x:auto;flex:0 0 auto;padding:9px;background:#e5e7e3;border-bottom:1px solid #cdd1cc;direction:rtl}
.book-tabs::-webkit-scrollbar{height:4px}.book-tabs::-webkit-scrollbar-thumb{background:#aaa;border-radius:5px}
.book-tab{flex:0 0 auto;border:1px solid #c9cdc9;background:#fff;color:#5a5f5c;padding:6px 9px;border-radius:7px;font-size:.58rem;font-weight:800;cursor:pointer}.book-tab.active{background:#2f6fd0;color:#fff;border-color:#2f6fd0}
.chapter-tab{font-size:.58rem}.chapter-label{align-self:center;color:#626763;font-size:.58rem;font-weight:800;padding:4px 7px}
.book-body{flex:1;min-height:0;overflow:auto;padding:22px 18px 40px;background:#f3f4f2;font-size:.82rem;line-height:2;color:#202321}
.head{margin-bottom:22px}.head h1{font-size:1.55rem;line-height:1.3;margin:0 0 2px;font-weight:800}.head .sub{color:#626763;margin:0 0 22px;font-size:.8rem}
.story-part{margin-bottom:28px}.story-part h2{font-size:1.02rem;line-height:1.5;margin:24px 0 12px;font-weight:800;color:#202321;border-top:1px solid #cdd1cc;padding-top:12px}.story-part p{margin:.75rem 0;text-align:justify}
.empty{color:#626763;text-align:center;padding:30px 8px}
@media(max-width:520px){.global-lang{top:10px;max-width:calc(100vw - 20px)}.book-body{padding:18px 14px 34px}}
@media(min-width:700px){.page{border-radius:4px}}
</style>
</head>
<body data-mode="fa">
<section class="page">
<div class="global-lang" id="global-lang" aria-label="زبان سایت"><button data-lang="zh" data-site-lang="zh" type="button">中文</button><button data-lang="fa" data-site-lang="fa" type="button">فارسی</button><button data-lang="en" data-site-lang="en" type="button">English</button><button data-lang="ar" data-site-lang="ar" type="button">العربية</button></div>
<header class="book-head"><div class="book-title" id="book-title">پژواک لایه سوم</div><button class="book-close" id="close" type="button" aria-label="بازگشت">✕</button></header>
<nav class="book-tabs" id="tabs" aria-label="فهرست"></nav>
<article class="book-body" id="body"></article>
</section>
<script src="translations/i18n.js"></script>
<script src="content/echo-layer3.js"></script>
<script>
(()=>{const c=window.EchoLayer3Content;const tabs=document.getElementById('tabs');const body=document.getElementById('body');
function render(){tabs.innerHTML='';body.innerHTML='';document.getElementById('book-title').textContent=c.title;
const head=document.createElement('div');head.className='head';head.innerHTML='<h1>'+c.title+'</h1><p class="sub">'+c.subtitle+'</p>';body.appendChild(head);
let first=true;
c.chapters.forEach(ch=>{const lab=document.createElement('span');lab.className='chapter-label';lab.textContent=ch.title;tabs.appendChild(lab);
ch.parts.forEach((part,i)=>{const b=document.createElement('button');b.className='book-tab'+(first?' active':'');b.textContent=part.title;b.dataset.target=part.id;tabs.appendChild(b);
const sec=document.createElement('section');sec.className='story-part';sec.id=part.id;sec.innerHTML='<h2>'+part.title+'</h2>'+part.text.map(p=>'<p>'+p+'</p>').join('');body.appendChild(sec);first=false;});
});
tabs.querySelectorAll('.book-tab').forEach(b=>b.addEventListener('click',()=>document.getElementById(b.dataset.target)?.scrollIntoView({behavior:'smooth',block:'start'})));
}
document.getElementById('close').addEventListener('click',()=>location.href='index.html');window.addEventListener('site:languagechange',render);render();
})();
</script>
</body></html>
