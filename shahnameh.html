<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="i18n-page" content="shahnameh"><meta name="format-detection" content="telephone=no"><meta http-equiv="Content-Language" content="fa">
<title>شاهنامه‌خوانی — Modern Outlook</title>
<style>
:root{color-scheme:dark;--bg:#090a0f;--panel:rgba(22,19,13,.82);--line:rgba(255,232,170,.22);--text:#f7f0df;--muted:rgba(247,240,223,.62)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:grid;place-items:center;overflow:hidden}
.wrap{position:relative;width:min(100vw,75vh);height:min(133.333333vw,100vh);aspect-ratio:3/4;overflow:hidden;padding:18px 18px 22px;background:radial-gradient(circle at 50% 0%,#38230d 0,#120f0b 34%,#090a0f 75%);box-shadow:0 0 0 1px rgba(255,232,170,.12),0 30px 100px rgba(0,0,0,.9);display:flex;flex-direction:column;min-height:0}
.wrap::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 8%,rgba(255,190,80,.10),transparent 28%),linear-gradient(180deg,rgba(0,0,0,.08),transparent 24%,transparent 78%,rgba(0,0,0,.35));z-index:0}
.wrap>*{position:relative;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex:0 0 auto;margin-bottom:14px;padding-top:8px}
.title{min-width:0}.title h1{margin:0;font-size:clamp(1.25rem,4vw,2rem)}.title p{margin:5px 0 0;color:var(--muted);font-size:.78rem}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.back{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:8px 12px;cursor:pointer}
.global-lang{position:absolute;z-index:10;top:10px;left:50%;transform:translateX(-50%);display:flex;direction:ltr;gap:2px;padding:3px;border:1px solid rgba(255,232,170,.22);border-radius:22px;background:rgba(8,8,10,.72);backdrop-filter:blur(10px)}
.global-lang button{border:0;background:transparent;color:rgba(255,255,255,.62);padding:5px 8px;border-radius:17px;cursor:pointer;font-size:.6rem;font-weight:800}.global-lang button.active{background:rgba(255,255,255,.14);color:#fff}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:7px;margin-bottom:12px;flex:0 0 auto;max-height:112px;overflow:auto;padding-right:1px}
.part{border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--text);border-radius:9px;padding:8px 5px;cursor:pointer;font-size:.72rem}.part.active{background:rgba(180,126,45,.22);box-shadow:0 0 0 1px rgba(255,220,130,.35) inset}
.reader{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:clamp(16px,3.5vw,28px);box-shadow:0 20px 60px rgba(0,0,0,.25);scrollbar-width:thin}
.reader h2{margin:0;font-size:clamp(1.05rem,3.4vw,1.55rem)}.block{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}.block h3{margin:0 0 9px;font-size:.92rem}.placeholder{color:var(--muted);line-height:1.9}.verse{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem;line-height:2.05;white-space:pre-line}.prose{line-height:2;white-space:pre-line}
@media(max-width:650px){.wrap{padding:14px 12px 16px}.top{align-items:flex-start;margin-bottom:10px}.title h1{font-size:1.25rem}.title p{font-size:.68rem}.parts{grid-template-columns:repeat(5,1fr);max-height:100px}.part{padding:7px 3px;font-size:.65rem}.reader{border-radius:15px;padding:15px}.global-lang{top:7px}}
@media(min-width:700px){.wrap{border-radius:4px}}
</style>
</head>
<body class="notranslate" translate="no">
<div class="global-lang notranslate" id="global-lang" aria-label="زبان سایت" translate="no"><button data-site-lang="zh" type="button">中文</button><button data-site-lang="fa" type="button">فارسی</button><button data-site-lang="en" type="button">English</button><button data-site-lang="ar" type="button">العربية</button></div>
<main class="wrap notranslate" translate="no">
<header class="top">
<div class="title"><h1 data-i18n="pages.shahnameh.title">شاهنامه‌خوانی</h1><p data-i18n="pages.shahnameh.subtitle">۸۱ قسمت · نظم اصیل فردوسی و نثر چهارزبانه</p></div>
<div class="actions"><button class="back" id="back" data-i18n="labels.back">بازگشت</button></div>
</header>
<nav class="parts notranslate" id="parts" translate="no"></nav>
<section class="reader notranslate" id="reader" translate="no"></section>
</main>
<script src="content/shahnameh.js?v=20261004-2"></script>
<script src="js/shahnameh-page.js?v=20261004-3" defer></script>
<script>
(function(){
  const KEY='modern-outlook.lang.v2';
  const buttons=document.querySelectorAll('[data-site-lang]');
  function sync(){
    let lang='fa';
    try{lang=localStorage.getItem(KEY)||'fa'}catch(_){}
    buttons.forEach(b=>{const active=b.dataset.siteLang===lang;b.classList.toggle('active',active);b.setAttribute('aria-pressed',active?'true':'false');});
  }
  buttons.forEach(b=>b.addEventListener('click',function(e){
    e.preventDefault();e.stopPropagation();
    try{localStorage.setItem(KEY,b.dataset.siteLang);localStorage.setItem('modern-outlook.lang.v1',b.dataset.siteLang)}catch(_){}
    sync();
  }));
  sync();
})();
</script>
<script src="site-audio.js" defer></script>
<script>document.documentElement.classList.add("notranslate");document.documentElement.setAttribute("translate","no");document.body.classList.add("notranslate");document.body.setAttribute("translate","no");</script>
</body></html>
