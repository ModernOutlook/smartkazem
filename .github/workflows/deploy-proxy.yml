name: Deploy Paragraph Machine proxy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Validate deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID OPENROUTER_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          echo "All required deployment secrets are present."

      - name: Deploy Worker and verify runtime bindings
        working-directory: proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({OPENROUTER_API_KEY: process.env.OPENROUTER_API_KEY}), {mode: 0o600})' "$secrets_file"
          npx --yes wrangler deploy --secrets-file "$secrets_file"

          health="$(curl --fail --silent --show-error https://modern-outlook-paragraph-proxy.game-kazem9877.workers.dev/health)"
          printf '%s' "$health" | node -e '
            let raw = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              let result;
              try { result = JSON.parse(raw); } catch (_) {
                console.error("Worker health endpoint returned invalid JSON.");
                process.exit(1);
              }
              if (result.configured !== true) {
                console.error("Worker deployed, but OPENROUTER_API_KEY is not available at runtime.");
                process.exit(1);
              }
              if (result.rateLimiterConfigured !== true) {
                console.error("Worker deployed, but PM_RATE_LIMITER is not available at runtime.");
                process.exit(1);
              }
              console.log("Worker health check passed: required runtime bindings are available.");
            });
          '
