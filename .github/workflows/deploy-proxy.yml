name: Deploy Paragraph Machine proxy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Deploy Worker with secret
        working-directory: proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          umask 077
          printf '{"OPENROUTER_API_KEY":"%s"}' "$OPENROUTER_API_KEY" > /tmp/paragraph-machine-secrets.json
          npx --yes wrangler deploy --secrets-file /tmp/paragraph-machine-secrets.json
          rm -f /tmp/paragraph-machine-secrets.json
