name: Verify GPT repository bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify GPT repository is readable and writable by the configured token
        env:
          GH_TOKEN: ${{ secrets.GPT_REPO_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Add repository secret GPT_REPO_SYNC_TOKEN: a fine-grained PAT scoped only to ModernOutlook/GPT with Contents: read and write."
            exit 1
          fi
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/ModernOutlook/GPT")"
          push="$(jq -r '.permissions.push // false' <<<"$response")"
          if [[ "$push" != "true" ]]; then
            echo "::error::Token cannot write to ModernOutlook/GPT. Check repository selection, Contents: read/write, organization approval, and token expiry."
            exit 1
          fi
          echo "PASS: ModernOutlook/GPT is accessible and reports push permission. No repository content was changed."
