name: UI browser smoke tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/smartkazem-http.log 2>&1 &
          echo $! > /tmp/smartkazem-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/smartkazem-http.log
          exit 1

      - name: Audit four-language HTML translation contracts
        run: node scripts/i18n-contract-check.mjs

      - name: Test language transitions and responsive overflow
        run: node scripts/ui-browser-smoke.mjs

      - name: Stop static site
        if: always()
        run: |
          if [ -f /tmp/smartkazem-http.pid ]; then kill "$(cat /tmp/smartkazem-http.pid)" || true; fi
