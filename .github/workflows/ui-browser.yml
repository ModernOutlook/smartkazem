name: UI browser smoke tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      approve_browser_download:
        description: "Explicitly approve downloading Playwright and Chromium if the reusable bundle cannot be accessed"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ui-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Detect image-only asset upload commit
        id: change-scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "image_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff-tree --no-commit-id --name-only -r HEAD^ HEAD)"
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -Ev '^content/bk[1-5]\.(jpe?g)$' >/dev/null; then
            echo "image_only=true" >> "$GITHUB_OUTPUT"
            echo "Only content/bk1.jpg/jpeg through content/bk5.jpg/jpeg changed in this commit; browser/language tests will be skipped."
          else
            echo "image_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.change-scope.outputs.image_only != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Validate browser cache contract
        if: steps.change-scope.outputs.image_only != 'true'
        run: node tests/browser-cache-contract.test.cjs

      - name: Restore cached Playwright and Chromium
        id: browser-cache
        if: steps.change-scope.outputs.image_only != 'true'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: smartkazem-browser-${{ runner.os }}-${{ runner.arch }}-node22-playwright1.55.0-chromium-v2

      - name: Import prebuilt Playwright and Chromium bundle from private GPT repository
        id: browser-bundle
        if: steps.change-scope.outputs.image_only != 'true' && steps.browser-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GPT_CACHE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "imported=false" >> "$GITHUB_OUTPUT"
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "GPT_CACHE_READ_TOKEN is not configured; reusable bundle import is unavailable."
            exit 0
          fi

          TAG="playwright-1.55.0-chromium-linux-x64"
          ARCHIVE="playwright-1.55.0-chromium-linux-x64.tar.gz"
          CHECKSUM="$ARCHIVE.sha256"
          DEST="$RUNNER_TEMP/playwright-release"
          mkdir -p "$DEST"

          gh release download "$TAG" --repo ModernOutlook/GPT \
            --pattern "$ARCHIVE" --pattern "$CHECKSUM" --dir "$DEST"

          cd "$DEST"
          sha256sum --check "$CHECKSUM"
          tar -xzf "$ARCHIVE" -C "$DEST"

          mkdir -p "$GITHUB_WORKSPACE/node_modules" "$HOME/.cache/ms-playwright"
          cp -a "$DEST/playwright-cache/npm/node_modules/." "$GITHUB_WORKSPACE/node_modules/"
          cp -a "$DEST/playwright-cache/ms-playwright/." "$HOME/.cache/ms-playwright/"

          node -e "const fs=require('node:fs'); const packagePath='$GITHUB_WORKSPACE/node_modules/playwright'; const pkg=require(packagePath+'/package.json'); const {chromium}=require(packagePath); if(pkg.version!=='1.55.0' || !fs.existsSync(chromium.executablePath())) process.exit(1)"
          echo "imported=true" >> "$GITHUB_OUTPUT"
          echo "Imported the reusable bundle and verified the Chromium executable."

      - name: Install Playwright and Chromium (explicit approval fallback)
        id: browser-install
        if: steps.change-scope.outputs.image_only != 'true' && steps.browser-cache.outputs.cache-hit != 'true' && steps.browser-bundle.outputs.imported != 'true' && ((github.event_name == 'workflow_dispatch' && inputs.approve_browser_download == true) || github.event_name == 'pull_request')
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium

      - name: Save reusable Playwright and Chromium cache
        if: (steps.browser-bundle.outputs.imported == 'true' || steps.browser-install.outcome == 'success') && steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: smartkazem-browser-${{ runner.os }}-node22-playwright1.55.0-chromium-v2

      - name: Check whether the exact browser toolchain is available
        id: browser-ready
        if: steps.change-scope.outputs.image_only != 'true'
        run: |
          if [ -f node_modules/playwright/package.json ] && node -e "const fs=require('node:fs'); const p=require('./node_modules/playwright/package.json'); const {chromium}=require('playwright'); process.exit(p.version === '1.55.0' && fs.existsSync(chromium.executablePath()) ? 0 : 1)"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require the browser toolchain before running browser tests
        if: steps.change-scope.outputs.image_only != 'true' && steps.browser-ready.outputs.ready != 'true'
        run: |
          echo "::error::Playwright 1.55.0 and its cached Chromium executable are unavailable. Configure GPT_CACHE_READ_TOKEN with Contents: read access to ModernOutlook/GPT, or manually dispatch this workflow with approve_browser_download=true to explicitly approve upstream installation."
          exit 1

      - name: Start static site
        if: steps.browser-ready.outputs.ready == 'true'
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/smartkazem-http.log 2>&1 &
          echo $! > /tmp/smartkazem-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/smartkazem-http.log
          exit 1

      - name: Run concise UI browser smoke
        if: steps.browser-ready.outputs.ready == 'true'
        run: node scripts/ui-browser-smoke.mjs

      - name: Stop static site
        if: always() && steps.browser-ready.outputs.ready == 'true'
        run: |
          if [ -f /tmp/smartkazem-http.pid ]; then kill "$(cat /tmp/smartkazem-http.pid)" || true; fi
