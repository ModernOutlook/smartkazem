name: Emergence II content alignment

on:
  push:
    branches: ["fix/emergence-2-paragraph-alignment"]

permissions:
  contents: write

jobs:
  align:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          ref: fix/emergence-2-paragraph-alignment

      - name: Install semantic alignment dependency
        run: python3 -m pip install --disable-pip-version-check sentence-transformers

      - name: Align existing translations to every Persian source line
        run: python3 scripts/emergence-2-semantic-align-v2.py

      - name: Validate generated content and confidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('translations/emergence-2.json').read_text())
          m = json.loads(Path('docs/emergence-2-paragraph-manifest.json').read_text())
          assert len(m['episodes']) == 11
          for ep in m['episodes']:
              row = next(x for x in d['episodes'] if x['number'] == ep['number'])
              n = ep['sourceParagraphCount']
              assert len(ep['paragraphs']) == n
              for lang in ('en','ar','zh'):
                  assert len(row['paragraphs'][lang]) == n
                  assert all(x.strip() and '[object Object]' not in x and 'placeholder' not in x.lower() for x in row['paragraphs'][lang])
                  assert all(0.05 <= p['alignment'][lang]['similarity'] <= 1 for p in ep['paragraphs'])
          print('11 episodes and all 33 translation arrays validated.')
          PY

      - name: Commit aligned translation reservoir and manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add translations/emergence-2.json docs/emergence-2-paragraph-manifest.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Align Emergence II translations to Persian line boundaries [skip ci]'
          git push origin HEAD:fix/emergence-2-paragraph-alignment
