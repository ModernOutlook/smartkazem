name: Deploy SmartKazem Community API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartkazem-community-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          COMMUNITY_SITE_ORIGIN: ${{ vars.COMMUNITY_SITE_ORIGIN }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID RESEND_API_KEY MAIL_FROM TURNSTILE_SECRET_KEY COMMUNITY_SITE_ORIGIN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub secret/variable: $name"
              exit 1
            fi
          done

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Provision D1 and R2 resources
        id: resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMUNITY_SITE_ORIGIN: ${{ vars.COMMUNITY_SITE_ORIGIN }}
        working-directory: community-worker
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")

          d1_list="$(curl --fail --silent --show-error "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")"
          d1_id="$(printf '%s' "$d1_list" | jq -r '.result[]? | select(.name=="smartkazem-community") | .uuid' | head -n1)"
          if [ -z "$d1_id" ]; then
            d1_created="$(curl --fail --silent --show-error -X POST "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" --data '{"name":"smartkazem-community"}')"
            d1_id="$(printf '%s' "$d1_created" | jq -r '.result.uuid // empty')"
          fi
          test -n "$d1_id" || { echo "::error::Could not provision D1 database"; exit 1; }

          r2_list="$(curl --fail --silent --show-error "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets")"
          has_bucket="$(printf '%s' "$r2_list" | jq -r '[.result.buckets[]? | select(.name=="smartkazem-community-media")] | length')"
          if [ "$has_bucket" = "0" ]; then
            curl --fail --silent --show-error -X POST "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets" --data '{"name":"smartkazem-community-media"}' >/dev/null
          fi

          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$d1_id/" wrangler.toml
          sed -i "s#https://modernoutlook.github.io#$COMMUNITY_SITE_ORIGIN#" wrangler.toml
          echo "D1 and R2 resources are present; Worker configuration has been prepared."

      - name: Apply D1 migrations
        working-directory: community-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.45.0 d1 migrations apply smartkazem-community --remote

      - name: Deploy Worker and configure runtime secrets
        id: deploy
        working-directory: community-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$RESEND_API_KEY" | npx --yes wrangler@4.45.0 secret put RESEND_API_KEY
          printf '%s' "$MAIL_FROM" | npx --yes wrangler@4.45.0 secret put MAIL_FROM
          printf '%s' "$TURNSTILE_SECRET_KEY" | npx --yes wrangler@4.45.0 secret put TURNSTILE_SECRET_KEY
          deploy_log="$(npx --yes wrangler@4.45.0 deploy 2>&1)"
          printf '%s\\n' "$deploy_log"
          worker_url="$(printf '%s\\n' "$deploy_log" | grep -Eo 'https://[^[:space:]]+\\.workers\\.dev' | tail -n1)"
          test -n "$worker_url" || { echo "::error::Could not determine deployed Worker URL from Wrangler output"; exit 1; }
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"

      - name: Verify deployed API
        env:
          COMMUNITY_API_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$COMMUNITY_API_URL/health" | node -e '
            let raw = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const result = JSON.parse(raw);
              if (result.ok !== true || result.service !== "smartkazem-community") process.exit(1);
              console.log("Community API health check passed.");
            });
          '
