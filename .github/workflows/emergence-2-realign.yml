name: Emergence II paragraph realignment

on:
  push:
    branches: ["fix/emergence-2-paragraph-alignment"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  realign:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: fix/emergence-2-paragraph-alignment

      - name: Setup Node
        uses: actions/setup-node@49933a5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Build and validate Emergence II alignment
        run: node scripts/emergence-2-content-realign.mjs --write

      - name: Commit generated alignment and manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add translations/emergence-2.json docs/emergence-2-paragraph-manifest.json README.md docs/canonical-book-content-audit.md
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Realign Emergence II translation paragraphs [skip ci]'
          git push origin HEAD:fix/emergence-2-paragraph-alignment
