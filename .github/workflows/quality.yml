name: Site quality gate

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22


      - name: Diagnose adapters/paragraph-workspace.js
        continue-on-error: true
        run: node --check "adapters/paragraph-workspace.js"
      - name: Diagnose audio-engine.js
        continue-on-error: true
        run: node --check "audio-engine.js"
      - name: Diagnose content/echo-layer3.js
        continue-on-error: true
        run: node --check "content/echo-layer3.js"
      - name: Diagnose content/emergence-2.js
        continue-on-error: true
        run: node --check "content/emergence-2.js"
      - name: Diagnose content/emergence.js
        continue-on-error: true
        run: node --check "content/emergence.js"
      - name: Diagnose content/forgers.js
        continue-on-error: true
        run: node --check "content/forgers.js"
      - name: Diagnose content/human-machines.js
        continue-on-error: true
        run: node --check "content/human-machines.js"
      - name: Diagnose content/shahnameh-series.js
        continue-on-error: true
        run: node --check "content/shahnameh-series.js"
      - name: Diagnose engine/paragraph-engine.js
        continue-on-error: true
        run: node --check "engine/paragraph-engine.js"
      - name: Diagnose js/app.js
        continue-on-error: true
        run: node --check "js/app.js"
      - name: Diagnose js/books.js
        continue-on-error: true
        run: node --check "js/books.js"
      - name: Diagnose js/emergence-2-page.js
        continue-on-error: true
        run: node --check "js/emergence-2-page.js"
      - name: Diagnose js/home-realm-info.js
        continue-on-error: true
        run: node --check "js/home-realm-info.js"
      - name: Diagnose js/observation25-page.js
        continue-on-error: true
        run: node --check "js/observation25-page.js"
      - name: Diagnose js/pages.js
        continue-on-error: true
        run: node --check "js/pages.js"
      - name: Diagnose js/paragraph-connection.js
        continue-on-error: true
        run: node --check "js/paragraph-connection.js"
      - name: Diagnose js/paragraph-page.js
        continue-on-error: true
        run: node --check "js/paragraph-page.js"
      - name: Diagnose js/possible-mirror-page.js
        continue-on-error: true
        run: node --check "js/possible-mirror-page.js"
      - name: Diagnose js/reading-page.js
        continue-on-error: true
        run: node --check "js/reading-page.js"
      - name: Diagnose js/shahnameh-series-page.js
        continue-on-error: true
        run: node --check "js/shahnameh-series-page.js"
      - name: Diagnose js/splash.js
        continue-on-error: true
        run: node --check "js/splash.js"
      - name: Diagnose proxy/worker.js
        continue-on-error: true
        run: node --check "proxy/worker.js"
      - name: Diagnose services/llm-client.js
        continue-on-error: true
        run: node --check "services/llm-client.js"
      - name: Diagnose services/translation-bridge.js
        continue-on-error: true
        run: node --check "services/translation-bridge.js"
      - name: Diagnose translations/i18n.js
        continue-on-error: true
        run: node --check "translations/i18n.js"
      - name: Diagnose ui/bootstrap.js
        continue-on-error: true
        run: node --check "ui/bootstrap.js"
      - name: Check JavaScript syntax
        run: |
          find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check

      - name: Validate JSON catalogs
        run: |
          python3 - <<'PY'
          import json, pathlib
          for p in pathlib.Path('.').rglob('*.json'):
              if '.git' in p.parts: continue
              with p.open(encoding='utf-8') as f: json.load(f)
              print('OK', p)
          PY

      - name: Check semantic page-state usage
        run: |
          if grep -RIn --include='*.js' --exclude-dir='.git' '\.style\.display' .; then
            echo 'Direct style.display usage is not allowed in application JavaScript.'
            exit 1
          fi
          if grep -RIn --include='*.html' --exclude-dir='.git' ' style=' .; then
            echo 'Inline style attributes are not allowed in HTML.'
            exit 1
          fi

      - name: Check HTML structure and local assets
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          bad=[]
          for p in pathlib.Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              ids=re.findall(r'\bid=["\']([^"\']+)["\']',s)
              dup=sorted({x for x in ids if ids.count(x)>1})
              if dup: bad.append(f'{p}: duplicate ids: {dup}')
              for attr in ('src','href'):
                  for ref in re.findall(r"\b"+attr+r"=[\"']([^\"'#?]+)",s):
                      if ref.startswith(('http://','https://','data:','mailto:','#')): continue
                      if not (p.parent/ref).exists(): bad.append(f'{p}: missing {attr}={ref}')
              inline_scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>\s*[^\s<][\s\S]*?</script>', s, re.I)
              for inline_script in inline_scripts:
                  if not re.match(r'<script\s+data-audio-bootstrap(?:\s[^>]*)?>', inline_script, re.I):
                      bad.append(f'{p}: inline script detected')
              if re.search(r'\bon[a-z]+\s*=', s, re.I):
                  bad.append(f'{p}: inline event handler detected')
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print('HTML checks passed')
          PY
