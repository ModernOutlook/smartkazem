name: Site quality gate

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check

      - name: Validate JSON catalogs
        run: |
          python3 - <<'PY'
          import json, pathlib
          for p in pathlib.Path('.').rglob('*.json'):
              if '.git' in p.parts: continue
              with p.open(encoding='utf-8') as f: json.load(f)
              print('OK', p)
          PY

      - name: Check HTML structure and local assets
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          bad=[]
          for p in pathlib.Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              ids=re.findall(r'\bid=["\']([^"\']+)["\']',s)
              dup=sorted({x for x in ids if ids.count(x)>1})
              if dup: bad.append(f'{p}: duplicate ids: {dup}')
              for attr in ('src','href'):
                  for ref in re.findall(r"\\b"+attr+r"=[\"']([^\"'#?]+)",s):
                      if ref.startswith(('http://','https://','data:','mailto:','#')): continue
                      if not (p.parent/ref).exists(): bad.append(f'{p}: missing {attr}={ref}')
              if re.search(r'<script(?![^>]*\bsrc=)[^>]*>\s*[^\s<][\s\S]*?</script>',s,re.I):
                  bad.append(f'{p}: inline script detected')
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print('HTML checks passed')
          PY

      - name: Validate SiteAudio integration
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys
          root = pathlib.Path('.')
          pages = {
              'index.html': 'blue',
              'observation.html': 'red',
              'philosophical-treatise.html': 'red',
              'shahnameh.html': 'yellow',
          }
          expected_rings = {
              'structure': 'blue',
              'continuity': 'yellow',
              'experience': 'purple',
              'reference': 'red',
              'share': 'green',
          }
          errors = []
          for name, theme in pages.items():
              source = (root / name).read_text(encoding='utf-8')
              if len(re.findall(r'<script\s+src="site-audio\.js"\s+defer\s*></script>', source, re.I)) != 1:
                  errors.append(f'{name}: expected exactly one deferred SiteAudio script')
              if not re.search(r'<html\b[^>]*data-sound-theme="' + re.escape(theme) + r'"', source, re.I):
                  errors.append(f'{name}: missing default sound theme {theme}')
              if source.count('data-sound-toggle') != 1:
                  errors.append(f'{name}: expected exactly one sound toggle')
              if 'data-i18n="labels.sound"' not in source:
                  errors.append(f'{name}: sound toggle label must use i18n')
          home = (root / 'index.html').read_text(encoding='utf-8')
          for realm, theme in expected_rings.items():
              if not re.search(r'data-id="' + re.escape(realm) + r'"[^>]*data-sound-theme="' + re.escape(theme) + r'"', home):
                  errors.append(f'index.html: {realm} ring must use {theme} theme')
          for lang, label in {'fa':'صدا','en':'Sound','zh':'声音','ar':'الصوت'}.items():
              catalog = json.loads((root / 'translations' / f'{lang}.json').read_text(encoding='utf-8'))
              if catalog.get('labels', {}).get('sound') != label:
                  errors.append(f'translations/{lang}.json: missing expected labels.sound')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('SiteAudio integration checks passed')
          PY