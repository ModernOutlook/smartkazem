<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Five Realms cosmic landscape">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#020813"/><stop offset=".48" stop-color="#08243a"/><stop offset="1" stop-color="#071018"/></linearGradient>
 <radialGradient id="nebula"><stop stop-color="#247b9a" stop-opacity=".72"/><stop offset=".55" stop-color="#342e70" stop-opacity=".28"/><stop offset="1" stop-color="#06101c" stop-opacity="0"/></radialGradient>
 <radialGradient id="sun"><stop stop-color="#fff8d8"/><stop offset=".14" stop-color="#f4d28a"/><stop offset=".4" stop-color="#76d9f2" stop-opacity=".72"/><stop offset="1" stop-color="#1b4e87" stop-opacity="0"/></radialGradient>
 <linearGradient id="water" x2="0" y2="1"><stop stop-color="#50c4e4" stop-opacity=".85"/><stop offset="1" stop-color="#122e49" stop-opacity=".08"/></linearGradient>
 <linearGradient id="gold" x2="1" y2="1"><stop stop-color="#ffe6a0"/><stop offset=".5" stop-color="#cda65c"/><stop offset="1" stop-color="#4f83b5"/></linearGradient>
 <linearGradient id="island" x2="0" y2="1"><stop stop-color="#294d59"/><stop offset="1" stop-color="#08111b"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="9"/></filter>
 <pattern id="stars" width="117" height="91" patternUnits="userSpaceOnUse"><circle cx="12" cy="19" r="1.2" fill="#d8f3ff" opacity=".85"/><circle cx="67" cy="42" r=".8" fill="#fff0c3" opacity=".75"/><circle cx="98" cy="8" r=".7" fill="#b4dfff"/><circle cx="40" cy="78" r=".6" fill="#fff"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/><rect width="1600" height="900" fill="url(#nebula)"/><rect width="1600" height="900" fill="url(#stars)"/>
